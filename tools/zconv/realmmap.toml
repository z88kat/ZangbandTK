# What each realm spell does, in 4.2's effect language.
#
# The same kind of file as mutmap.toml and for the same reason: there is no
# mechanical route from Zangband's `cast_*_spell()` switches to a 4.2 effect
# chain. Each entry is a judgement, made once, written down with the source line
# it came off and what the translation costs.
#
# The numbers -- level, mana, failure and experience -- are deliberately **not**
# here. They come out of `magic_info[]` per class and per realm, so a spell is
# one entry in this file and appears in class.txt once for every class entitled
# to its realm, carrying that class's own figures.
#
# `defer` marks a spell 4.2 cannot express, with the reason. A deferred spell is
# still emitted -- level, mana, failure and all -- but with no effect chain, and
# the conversion report lists it. That is deliberate: a book with a hole in it
# and a note saying so is honest, and a spell quietly missing from a book is not.
#
# Source: archive/zangband/src/cmd5.c, cast_sorcery_spell().

[sorcery]
books = [
  "Beginner's Handbook",
  "Master Sorcerer's Handbook",
  "Pattern Sorcery",
  "Grimoire of Power",
]

[sorcery.spells."Detect Monsters"]
line = 806
effects = [ "DETECT_VISIBLE_MONSTERS", "effect-yx:22:40" ]
desc = "Detects all monsters nearby that are not invisible."

[sorcery.spells."Phase Door"]
line = 809
effects = [ "TELEPORT", "dice:10" ]
desc = "Teleports you a short distance -- ten squares."

[sorcery.spells."Detect Doors and Traps"]
line = 812
effects = [ "DETECT_TRAPS", "effect-yx:22:40", "DETECT_DOORS", "effect-yx:22:40", "DETECT_STAIRS", "effect-yx:22:40" ]
desc = "Detects doors, traps and staircases nearby."

[sorcery.spells."Light Area"]
line = 817
effects = [ "LIGHT_AREA", "SPHERE:LIGHT_WEAK:2", "dice:2d$S", "expr:S:PLAYER_LEVEL:/ 2" ]
desc = "Lights the area around you, and hurts light-sensitive monsters caught in it."

[sorcery.spells."Confuse Monster"]
line = 820
effects = [ "BOLT_AWARE:MON_CONF", "dice:5+d$S", "expr:S:PLAYER_LEVEL:- 5" ]
note = "Zangband passes (plev * 3) / 2 as a power; 4.2's own Confuse Monster uses 5+d(level-5), and the two are close enough that keeping 4.2's shape beats introducing a second convention."
desc = "Attempts to confuse a single monster."

[sorcery.spells."Teleport"]
line = 823
effects = [ "TELEPORT", "dice:$B", "expr:B:PLAYER_LEVEL:* 5" ]
desc = "Teleports you a long way -- five squares for every level you have."

[sorcery.spells."Sleep Monster"]
line = 826
effects = [ "BOLT_AWARE:SLEEP_ALL", "dice:$B", "expr:B:PLAYER_LEVEL:* 10 + 500" ]
desc = "Attempts to put a single monster to sleep."

[sorcery.spells."Recharging"]
line = 829
effects = [ "RECHARGE", "dice:$B", "expr:B:PLAYER_LEVEL:* 4" ]
note = "Zangband's recharge(plev * 4) is four times the strength 4.2's own Recharging uses at the same level. Kept, because Sorcery is the utility realm and this is one of the reasons to study it."
desc = "Recharges a wand or a staff, and may destroy it if the attempt fails."

[sorcery.spells."Magic Mapping"]
line = 832
effects = [ "MAP_AREA", "effect-yx:22:40" ]
desc = "Maps the area around you."

[sorcery.spells."Identify"]
line = 835
effects = [ "IDENTIFY" ]
note = "4.2 identifies runes rather than objects -- a rune learned is learned on every object carrying it -- so this is 4.2's own Identify Rune under Zangband's name. The name is Zangband's because the spell is in Zangband's book; what it does is 4.2's, because that is the mechanism the game has."
desc = "Identifies a rune on an object you are carrying."

[sorcery.spells."Slow Monster"]
line = 838
effects = [ "BOLT_STATUS:MON_SLOW", "dice:5+d$S", "expr:S:PLAYER_LEVEL:- 5" ]
desc = "Attempts to slow a single monster."

[sorcery.spells."Mass Sleep"]
line = 841
effects = [ "PROJECT_LOS:SLEEP_ALL", "dice:$B", "expr:B:PLAYER_LEVEL:* 10 + 500" ]
desc = "Attempts to put every monster you can see to sleep."

[sorcery.spells."Teleport Away"]
line = 844
effects = [ "BEAM:AWAY_ALL", "dice:$B", "expr:B:PLAYER_LEVEL:+ 0" ]
desc = "Fires a beam that teleports away every monster it strikes. Some resist."

[sorcery.spells."Haste Self"]
line = 847
effects = [ "TIMED_INC:FAST:0:5", "dice:$B+d20", "expr:B:PLAYER_LEVEL:+ 0" ]
desc = "Hastens you for a while."

[sorcery.spells."Detection True"]
line = 850
effects = [ "DETECT_VISIBLE_MONSTERS", "effect-yx:22:40", "DETECT_INVISIBLE_MONSTERS", "effect-yx:22:40", "DETECT_TRAPS", "effect-yx:22:40", "DETECT_DOORS", "effect-yx:22:40", "DETECT_STAIRS", "effect-yx:22:40", "DETECT_GOLD", "effect-yx:22:40", "DETECT_OBJECTS", "effect-yx:22:40" ]
note = "Zangband's detect_all() in the parts 4.2 has. It also revealed object kinds the player had not learned, which 4.2 has no equivalent for since it identifies runes rather than objects."
desc = "Detects everything nearby: monsters seen and unseen, doors, traps, stairs, treasure and objects."

[sorcery.spells."Identify True"]
line = 853
defer = "identify_fully() tells the player everything about an object at once. 4.2 has no such thing and cannot have: it replaced whole-object identification with runes, learned one at a time by carrying and using the thing. There is no hidden complete description for a spell to reveal, so this would have to invent the very mechanic 4.2 removed."

[sorcery.spells."Detect Objects and Treasure"]
line = 858
effects = [ "DETECT_OBJECTS", "effect-yx:22:40", "DETECT_GOLD", "effect-yx:22:40" ]
desc = "Detects objects and treasure nearby."

[sorcery.spells."Detect Enchantment"]
line = 863
defer = "detect_objects_magic() marks every nearby object carrying an enchantment, which in Zangband is a property the player may not know. 4.2 has no equivalent: an object's runes are either learned or not, and there is no separate is-this-magical bit to detect. Detecting objects at all is already DETECT_OBJECTS, two spells up this same book, so mapping it there would give the realm two spells doing one thing."

[sorcery.spells."Charm Monster"]
line = 866
effects = [ "COMMAND" ]
note = "charm_monster() makes a permanent pet in Zangband; 4.2's COMMAND takes a monster over for a while, because 4.2 has no pets. The same mapping the hypnotic gaze mutation got."
desc = "Takes control of a monster for a time."

[sorcery.spells."Dimension Door"]
line = 869
effects = [ "TELEPORT_TO" ]
desc = "Opens a gate to a place you choose nearby."

[sorcery.spells."Sense Minds"]
line = 873
effects = [ "TIMED_INC:TELEPATHY", "dice:24+1d31" ]
desc = "Grants telepathy for a while."

[sorcery.spells."Self Knowledge"]
line = 876
defer = "self_knowledge() prints everything the character is -- every resistance, sustain and ability, from every source at once. 4.2 retired it because the character sheet carries the same information continuously, on the pages reached with 'h', so the spell would tell the player what is already on screen. The same reasoning retired the Weigh Magic mutation."

[sorcery.spells."Teleport Level"]
line = 879
effects = [ "TELEPORT_LEVEL" ]
desc = "Teleports you one level up or down, without choosing which."

[sorcery.spells."Word of Recall"]
line = 882
effects = [ "RECALL" ]
desc = "Returns you from the dungeon, or takes you back down, after a delay."

[sorcery.spells."Stasis"]
line = 885
effects = [ "BOLT_STATUS:MON_HOLD", "dice:$B", "expr:B:PLAYER_LEVEL:* 10 + 500" ]
desc = "Attempts to hold a single monster completely still."

[sorcery.spells."Telekinesis"]
line = 888
effects = [ "FETCH", "dice:$B", "expr:B:PLAYER_LEVEL:* 15" ]
note = "The strongest of FETCH's three callers: fifteen per level and no need to see what it takes, against the mutation's ten and its requirement of sight. That difference is why the effect takes both as parameters."
desc = "Pulls a distant object to your feet, whether or not you can see it."

[sorcery.spells."Explosive Rune"]
line = 891
defer = "explosive_rune() lays a glyph that detonates when a monster steps on it. 4.2 has a warding glyph -- GLYPH with GLYPH_WARDING -- which monsters will not cross, and that is a different spell rather than a weaker one: warding turns a corridor into a wall, an explosive rune is a trap the player sets. Mapping one onto the other would give Sorcery a second Glyph of Warding under a name promising an explosion."

[sorcery.spells."Clairvoyance"]
line = 894
effects = [ "LIGHT_LEVEL", "TIMED_INC:TELEPATHY", "dice:24+1d31" ]
note = "Zangband grants the telepathy only to a character who has none already; 4.2's TIMED_INC extends what is there, which is the kinder reading and costs nobody anything."
desc = "Lights the whole level, and grants telepathy for a while."

[sorcery.spells."Enchant Weapon"]
line = 899
effects = [ "ENCHANT:TOBOTH", "dice:1d4" ]
desc = "Attempts to enchant a weapon, to hit and to wound."

[sorcery.spells."Enchant Armour"]
line = 902
effects = [ "ENCHANT:TOAC", "dice:1+1d3" ]
desc = "Attempts to enchant a suit of armour."

[sorcery.spells."Alchemy"]
line = 905
effects = [ "ALCHEMY" ]
note = "The mechanic DEC-52 built, shared with the Midas touch mutation and a random-artifact activation."
desc = "Turns an object into a third of its worth in gold. Artifacts refuse."

[sorcery.spells."Globe of Invulnerability"]
line = 908
effects = [ "TIMED_INC:INVULN", "dice:7+1d8" ]
desc = "Makes you briefly untouchable."

# Source: archive/zangband/src/cmd5.c, cast_chaos_spell().

[chaos]
books = [
  "Sign of Chaos",
  "Chaos Mastery",
  "Chaos Channels",
  "Armageddon Tome",
]

[chaos.spells."Magic Missile"]
line = 1090
effects = [ "BOLT_OR_BEAM:MISSILE:0:-10", "dice:$Dd4", "expr:D:PLAYER_LEVEL:- 1 / 5 + 3" ]
desc = "Fires a weak magical bolt, sometimes as a beam."

[chaos.spells."Trap / Door Destruction"]
line = 1096
effects = [ "TOUCH:KILL_DOOR", "TOUCH:KILL_TRAP" ]
desc = "Destroys the doors and traps in the squares next to you."

[chaos.spells."Flash of Light"]
line = 1099
effects = [ "LIGHT_AREA", "SPHERE:LIGHT_WEAK:1", "dice:2d$S", "expr:S:PLAYER_LEVEL:/ 2" ]
note = "4.2's radius is a literal, not an expression, so a radius that grows with level cannot be carried over. The rule, applied the same way everywhere: take the value at the level the earliest-entitled class learns the spell -- a Mage for all five in Chaos. A Mage learns this at 3, so plev/10+1 is 1. It never grows to the 6 it reached at level 50."
desc = "Lights the area around you, and hurts light-sensitive monsters caught in it."

[chaos.spells."Touch of Confusion"]
line = 1102
effects = [ "TIMED_INC:ATT_CONF", "dice:$B", "expr:B:PLAYER_LEVEL:+ 20" ]
note = "Zangband sets a flag that lasts until it is spent on a blow; 4.2 expresses the same idea as a timed ATT_CONF, which is the only shape the game has for it. So it can lapse unspent, where Zangband's waited."
desc = "Makes your hands glow.  Your next blows may confuse what they touch."

[chaos.spells."Mana Burst"]
line = 1110
effects = [ "BALL:MISSILE:2", "dice:$B+3d5", "expr:B:PLAYER_LEVEL:* 5 / 4" ]
note = "4.2's radius is a literal, not an expression, so a radius that grows with level cannot be carried over. The rule, applied the same way everywhere: take the value at the level the earliest-entitled class learns the spell -- a Mage for all five in Chaos. A Mage learns this at 9, so the radius is 2. The step up to 3 at level 30 is lost. Zangband adds plev/2 for a Mage or High-Mage and plev/4 for everyone else, which the data language cannot ask. Taking the average as plev*5/4 -- that is plev + plev/4 -- gives every class the non-mage figure plus the base, and a Mage a little less than Zangband gave one."
desc = "Fires a ball of pure magical force."

[chaos.spells."Fire Bolt"]
line = 1122
effects = [ "BOLT_OR_BEAM:FIRE", "dice:$Dd8", "expr:D:PLAYER_LEVEL:- 5 / 4 + 8" ]
desc = "Fires a bolt of fire, sometimes as a beam."

[chaos.spells."Fist of Force"]
line = 1128
effects = [ "BALL:FORCE:0", "dice:$Dd8", "expr:D:PLAYER_LEVEL:- 5 / 4 + 8" ]
note = "DEC-53. Zangband fires disintegration, which damages and deletes walls at once; 4.2 has no such element. At 8 mana this spell is not the one that should be reshaping the dungeon, so it keeps the damage and loses the walls. Force stuns, which disintegration did not -- a gain, not a loss, and stated."
desc = "Strikes a single square with a fist of raw force."

[chaos.spells."Teleport Self"]
line = 1134
effects = [ "TELEPORT", "dice:$B", "expr:B:PLAYER_LEVEL:* 5" ]
desc = "Teleports you a long way -- five squares for every level you have."

[chaos.spells."Wonder"]
line = 1137
effects = [ "WONDER", "dice:100+m$M", "expr:M:PLAYER_LEVEL:/ 5" ]
note = "A found match rather than a translation: 4.2's WONDER handler is the same table as Zangband's Wonder, band for band, down to the plev/5 added to the roll and the comment explaining it. Two of the twenty-two bands differ in dice -- 4.2's lightning is a beam of 3+(plev-5)/6 d6 where Zangband's is a bolt-or-beam of 3+(plev-5)/4 d8 -- and nothing else does."
desc = "Does something.  Anything.  The higher your level the less likely it is to be something you regret."

[chaos.spells."Chaos Bolt"]
line = 1206
effects = [ "BOLT_OR_BEAM:CHAOS", "dice:$Dd8", "expr:D:PLAYER_LEVEL:- 5 / 4 + 10" ]
desc = "Fires a bolt of raw chaos, sometimes as a beam."

[chaos.spells."Sonic Boom"]
line = 1212
effects = [ "SPHERE:SOUND:4", "dice:45+$B", "expr:B:PLAYER_LEVEL:+ 0" ]
note = "4.2's radius is a literal, not an expression, so a radius that grows with level cannot be carried over. The rule, applied the same way everywhere: take the value at the level the earliest-entitled class learns the spell -- a Mage for all five in Chaos. A Mage learns this at 20, so plev/10+2 is 4. It never grows to 7."
desc = "Shakes the room with a burst of sound centred on you."

[chaos.spells."Doom Bolt"]
line = 1217
effects = [ "BEAM:MANA", "dice:$Dd8", "expr:D:PLAYER_LEVEL:- 5 / 4 + 11" ]
desc = "Fires a beam of pure mana that nothing resists."

[chaos.spells."Fire Ball"]
line = 1222
effects = [ "BALL:FIRE:2", "dice:55+$B", "expr:B:PLAYER_LEVEL:+ 0" ]
desc = "Fires a large ball of fire."

[chaos.spells."Teleport Other"]
line = 1227
effects = [ "BEAM:AWAY_ALL", "dice:$B", "expr:B:PLAYER_LEVEL:+ 0" ]
note = "A beam, not a bolt: Chaos's version clears a whole line of monsters out of your path where Sorcery's Teleport Away takes one. The two are deliberately different spells and both are kept."
desc = "Fires a beam that teleports away every monster in its path."

[chaos.spells."Word of Destruction"]
line = 1232
effects = [ "DESTRUCTION:LIGHT:15" ]
desc = "Destroys everything in the area around you, and the walls with it."

[chaos.spells."Invoke Logrus"]
line = 1235
effects = [ "BALL:CHAOS:6", "dice:66+$B", "expr:B:PLAYER_LEVEL:+ 0" ]
note = "4.2's radius is a literal, not an expression, so a radius that grows with level cannot be carried over. The rule, applied the same way everywhere: take the value at the level the earliest-entitled class learns the spell -- a Mage for all five in Chaos. A Mage learns this at 30, so plev/5 is 6. It never grows to 10."
desc = "Calls up a vast ball of chaos.  It grows with your level."

[chaos.spells."Polymorph Other"]
line = 1240
effects = [ "BOLT:MON_POLY", "dice:$B", "expr:B:PLAYER_LEVEL:+ 0" ]
desc = "Turns a single monster into something else."

[chaos.spells."Chain Lightning"]
line = 1245
effects = [ "STAR:ELEC", "dice:$Dd8", "expr:D:PLAYER_LEVEL:/ 10 + 5" ]
desc = "Fires a beam of lightning in every direction at once."

[chaos.spells."Arcane Binding"]
line = 1249
effects = [ "RECHARGE", "dice:90" ]
note = "Zangband's recharge(90) against 4.2's Recharging at plev/8+6 -- Chaos's is roughly four times the strength, the same relationship Sorcery's Recharging has, and the number is taken as written."
desc = "Recharges a wand or staff, powerfully."

[chaos.spells."Disintegrate"]
line = 1251
effects = [ "BALL:KILL_WALL:3", "BALL:MANA:3", "dice:80+$B", "expr:B:PLAYER_LEVEL:+ 0" ]
note = "4.2's radius is a literal, not an expression, so a radius that grows with level cannot be carried over. The rule, applied the same way everywhere: take the value at the level the earliest-entitled class learns the spell -- a Mage for all five in Chaos. A Mage learns this at 35, so 3+plev/40 is 3. The step up to 4 at level 40 is lost. DEC-53. Disintegration did two things 4.2 keeps apart: it deleted walls and it damaged monsters with a type nothing resisted. Here that is two effects in one chain -- KILL_WALL for the terrain, MANA for the damage -- so the spell keeps both halves. The cost is that monsters are struck by two projections rather than one, and rock-hurt monsters take the KILL_WALL damage as well."
desc = "Annihilates everything in a ball, and the walls with it."

[chaos.spells."Alter Reality"]
line = 1256
effects = [ "ALTER_REALITY" ]
desc = "Rebuilds the level around you."

[chaos.spells."Polymorph Self"]
line = 1259
effects = [ "POLY_SELF" ]
note = "The same effect DEC-47 built for the mutation, called from a second place. Chaos is the realm the spoiler says can twist its own caster, and this is that spell."
desc = "Twists your own body.  You may gain or lose mutations, and you will not choose which."

[chaos.spells."Chaos Branding"]
line = 1262
effects = [ "BRAND_WEAPON" ]
note = "Zangband brands with the Chaotic ego; 4.2's BRAND_WEAPON gives Flame or Frost on a coin flip and has no chaos brand to give. Which brand you get is at least unpredictable, which is the spell's character if not its element. Adding a Chaos brand to brand.txt would need BRAND_WEAPON to take a parameter, and is not in this pass."
desc = "Brands your weapon.  You do not choose with what."

[chaos.spells."Summon Demon"]
line = 1265
effects = [ "SUMMON:DEMON", "dice:1" ]
note = "Zangband gives a one-in-three chance the demon serves you. 4.2 has no pets and no monster allegiance at all, so every demon this calls is hostile. That is a real loss of the spell's point and it is recorded rather than papered over."
desc = "Summons a demon.  It will not be pleased to see you."

[chaos.spells."Beam of Gravity"]
line = 1285
effects = [ "BEAM:GRAVITY", "dice:$Dd8", "expr:D:PLAYER_LEVEL:- 5 / 4 + 9" ]
desc = "Fires a beam of gravity that batters and slows what it hits."

[chaos.spells."Meteor Swarm"]
line = 1290
effects = [ "SWARM:METEOR:2", "dice:$B+m15", "expr:B:PLAYER_LEVEL:* 3 / 2" ]
note = "Zangband scatters ten to twenty meteors on random squares within five of you; 4.2's SWARM throws its balls at one target. The count becomes a flat fifteen where Zangband rolled ten to twenty, because the swarm size is a fixed part of the dice string, and the aim becomes a target rather than the ground around you -- more accurate than Zangband's and no stronger per meteor."
desc = "Calls down a swarm of meteors."

[chaos.spells."Flame Strike"]
line = 1322
effects = [ "SPHERE:FIRE:8", "dice:150+$B", "expr:B:PLAYER_LEVEL:* 2" ]
desc = "Engulfs everything around you in fire."

[chaos.spells."Call Chaos"]
line = 1325
effects = [ "RANDOM", "dice:3", "BALL:CHAOS:3", "dice:150", "STAR_BALL:PLASMA:2", "dice:75", "SPHERE:MANA:8", "dice:300" ]
note = "Zangband rolls one of thirty damage types and then one of three shapes: balls in all nine directions at 75, a huge ball centred on you at 300, or an aimed ball or beam at 150. Thirty types is not something the data language can hold, so the three shapes are kept and given one type each -- chaos aimed, plasma outward, mana centred. The roll is still there and still decides what happens; what it no longer decides is the element."
desc = "Calls on chaos.  What arrives is not up to you."

[chaos.spells."Magic Rocket"]
line = 1328
effects = [ "BALL:SHARD:2", "dice:120+$B", "expr:B:PLAYER_LEVEL:+ 0" ]
note = "DEC-53. 4.2 has no rocket. Zangband's rocket does great damage that little resists and cuts what survives; shards is the element that cuts, so shards it is. Shard resistance now helps against it, where almost nothing helped before."
desc = "Launches a rocket that shreds what it hits."

[chaos.spells."Mana Storm"]
line = 1334
effects = [ "BALL:MANA:4", "dice:300+$B", "expr:B:PLAYER_LEVEL:* 2" ]
desc = "Calls down a storm of raw mana.  Nothing resists it."

[chaos.spells."Breathe Logrus"]
line = 1339
effects = [ "BALL:CHAOS:2", "dice:$B", "expr:B:PLAYER_HP:+ 0" ]
note = "The damage is your current hit points, which 4.2 can say: PLAYER_HP is one of its dice bases. Cast it healthy."
desc = "Breathes chaos with everything you have.  The damage is your own current hit points."

[chaos.spells."Call the Void"]
line = 1344
effects = [ "STAR_BALL:SHARD:2", "dice:175", "STAR_BALL:MANA:3", "dice:175", "STAR_BALL:POIS:4", "dice:175" ]
note = "Zangband fires twenty-seven balls outward -- nine rockets, nine mana, nine nuke -- unless you are standing next to a wall, in which case it destroys the area and takes 100 to 250 hit points off you. The three volleys become three STAR_BALLs with the elements DEC-53 chose. The wall clause is dropped: the effect language has no test on the terrain around the caster, so the spell can no longer punish you for casting it in a corridor. That is the spell's defining risk and it is gone, said plainly rather than quietly."
desc = "Fires three volleys of destruction outward in every direction."
