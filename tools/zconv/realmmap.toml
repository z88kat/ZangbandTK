desc = "Removes fear."

[life.spells."Call Light"]
line = 620
effects = [ "LIGHT_AREA", "SPHERE:LIGHT_WEAK:1:10", "dice:2d$S",
            "expr:S:PLAYER_LEVEL:/ 2" ]
desc = "Lights up the area and hurts light-sensitive creatures in it."

[life.spells."Detect Traps and Secret Doors"]
