[death.spells."Hellfire"]
line = 1683
effects = [ "BALL:MANA:3", "dice:666", "DAMAGE", "dice:49+1d51", "effect-msg:the strain of casting Hellfire" ]
note = "DEC-53's list of elements 4.2 does not have includes GF_HELL_FIRE, and this is where it finally matters. Zangband's hell fire does double damage to *good* monsters; 4.2 has a projection that favours evil (HOLY_ORB) and none that favours good. MANA is taken instead -- the property that decides how the spell plays is that nothing resists it, which is a Death caster's answer to a resistant target. NETHER would have been the closer flavour and the worse spell: undead resist nether, and it would have handed the realm's own quarry immunity to its biggest attacks. Six hundred and sixty-six is Zangband's number and is kept, and so is the fifty to a hundred hit points it costs to cast -- which is the whole of the spell's character and the reason it is not simply the best attack in the game."
