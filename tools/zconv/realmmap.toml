# Source: archive/zangband/src/cmd5.c, cast_arcane_spell().

# Zangband is explicit that this is the weak generalist -- "it has no
# ultra-powerful high level spells... all Arcane spellbooks can be bought in
# town" -- and the content bears that out: thirty-two spells and exactly one
# that does damage worth the name. DEC-49 records that folding it together with
# 4.2's own arcane realm makes this game's Arcane stronger than Zangband's was,
# because 4.2 put Magic Missile and two books of attacks in it.

[arcane]
books = [
  "Cantrips for Beginners",
  "Minor Arcana",
  "Major Arcana",
  "Manual of Mastery",
]

# All four are bought in town, which is the realm's defining trait rather than a
# detail: "all Arcane spellbooks can be bought in town" is the half of the
# spoiler's sentence that pays for the other half, that Arcane "has no
# ultra-powerful high level spells". Zangband's own k_info agrees -- the four
# cost 100, 250, 1000 and 2500 and are allocated at depths 10, 15, 20 and 35,
# where Sorcery's fourth book costs 100,000 and appears at 95. The flag is not
# cosmetic: store.c always stocks a town book and never a dungeon one.
books-in-town = 4

# Zangband's own costs, and its own allocation depths rescaled from its
# 128-level dungeon to 4.2's hundred. The first stays at depth 1 because a Mage
# casts from it at level 1.
book-tiers = [
  "100:40:1 to 100",
  "250:40:12 to 100",
  "1000:30:16 to 100",
  "2500:20:27 to 100",
]

