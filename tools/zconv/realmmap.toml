[death.spells."Raise the Dead"]
line = 1655
defer = """raise_dead() animates the corpses and skeletons *actually lying \
on the floor nearby*, two in three of them as pets. The pet half of that wall \
came down with PLR-22; the other half did not. Zangband keeps corpses and \
skeletons as fields on the ground, dropped by DROP_CORPSE and DROP_SKELETON \
monsters, and 4.2 has no such object and no such flag -- there is nothing \
lying there to raise. Translating it as "summon undead as pets" would be a \
different spell wearing this one's name: this one is paid for by what you \
have already killed, and that is the whole character of it. Re-deferred in \
3.72.0 with the reason corrected, rather than left reading as blocked on pets \
when pets have arrived."""

