# Source: archive/zangband/src/cmd5.c, cast_death_spell().

# The last of the four realms Angband already had, and the only one neither of
# its 4.2 classes can import directly: the Necromancer and the Blackguard both
# post-date Zangband, so both cast on borrowed figures under DEC-55 -- the
# Necromancer on Zangband's Mage, the Blackguard on its Paladin.

[death]
books = [
  "Black Prayers",
  "Black Mass",
  "Black Channels",
  "Necronomicon",
]

[death.spells."Detect Unlife"]
line = 1376
effects = [ "DETECT_VISIBLE_MONSTERS", "effect-yx:22:40" ]
note = "detect_monsters_nonliving() finds what has no life; 4.2 detects the living (DETECT_LIVING_MONSTERS) and has no inverse. Detecting everything visible is wider than asked and never narrower, which is the direction to err in for a detection -- and DETECT_SOUL, the other candidate, finds spirits rather than their absence."
desc = "Detects creatures nearby."

[death.spells."Malediction"]
line = 1379
effects = [ "BALL:MANA:0", "dice:$Dd3", "expr:D:PLAYER_LEVEL:- 1 / 5 + 3" ]
note = "DEC-53's list of elements 4.2 does not have includes GF_HELL_FIRE, and this is where it finally matters. Zangband's hell fire does double damage to *good* monsters; 4.2 has a projection that favours evil (HOLY_ORB) and none that favours good. MANA is taken instead -- the property that decides how the spell plays is that nothing resists it, which is a Death caster's answer to a resistant target. NETHER would have been the closer flavour and the worse spell: undead resist nether, and it would have handed the realm's own quarry immunity to its biggest attacks. The one-in-five extra -- fear, confusion, stunning, or on a one-in-a-thousand roll of 666 an outright death ray -- is not carried: a chain cannot roll a second effect at a probability of its own. Zangband's own comment explains the radius-0 ball rather than a bolt, and that is kept: it can be aimed at any visible monster."
desc = "Curses a creature with unresisted force."

