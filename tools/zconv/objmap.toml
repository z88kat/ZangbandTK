# Zangband object kinds -> Angband 4.2's object.txt (CNT-11).
#
# Object *flags* are mapped by objflagmap.toml, shared with the artifact and
# ego converters. This file holds what is specific to whole object kinds:
# which tval becomes which 4.2 type, which kinds 4.2 already has under another
# name, which are deferred for want of a mechanism, and how the Lua on a
# consumable becomes a 4.2 effect.
#
# Keys are "tval:sval", not names. An object kind's identity in these files is
# its slot: Zangband has 59 names that collide with another of its own kinds
# (two Amulets and Rings of Sensing, three Copper coins), and keying by name
# silently loses 80 of its 553 records. `name = ` on each entry is there to be
# read, not matched.

# ---------------------------------------------------------------- types
# Zangband's tval numbers to 4.2's type names. The two games agree on every
# number they share; 4.2 has no type for figurines or statues, which is dealt
# with under "defers" below.

[type]
16 = "shot"
17 = "arrow"
18 = "bolt"
19 = "bow"
20 = "digger"
21 = "hafted"
22 = "polearm"
23 = "sword"
30 = "boots"
31 = "gloves"
32 = "helm"
33 = "crown"
34 = "shield"
35 = "cloak"
36 = "soft armor"
37 = "hard armor"
38 = "dragon armor"
39 = "light"
40 = "amulet"
45 = "ring"
55 = "staff"
65 = "wand"
66 = "rod"
70 = "scroll"
75 = "potion"
77 = "flask"
80 = "food"

# --------------------------------------------------------------- renames
#
# Zangband renamed 26 object kinds it inherited from Angband 2.8.1 without
# changing what they are. 4.2 still ships all ten of the non-spellbook ones
# under the older name, so importing them would put a second Ring of Accuracy
# in the game called a Ring of Skill.
#
# This is the same trap as the `&`/`~` normalisation recorded in
# phase1-content-and-flavour.md §1, one level deeper: normalising the article
# markers makes the names comparable, but two games can still call one object
# by two names. Comparing slots rather than names is what catches these.
#
# Only kinds that are the same *object* belong here. Zangband also re-used four
# slots for something different -- an Amulet of Berserk Strength where 2.8.1
# had Adornment, a Wand of Tame Monster where it had Lightning Bolts -- and
# those are new content, not renames.

[rename]
"17:2"  = { name = "Sheaf Arrow", to = "Seeker Arrow" }
"18:1"  = { name = "Steel Bolt", to = "Bolt" }
"38:10" = { name = "Pseudo Dragon Scale Mail", to = "Shining Dragon Scale Mail", note = "4.2 gives it the DRAGON_SHINING activation, which breathes light or darkness exactly as Zangband's Lua does" }
"40:5"  = { name = "Sensing", to = "Searching", note = "SENSE is Zangband's data-file name for the searching skill" }
"45:23" = { name = "Sensing", to = "Searching" }
"45:7"  = { name = "Levitation", to = "Feather Falling" }
"45:28" = { name = "Skill", to = "Accuracy", note = "both roll a to-hit bonus and nothing else" }
"45:29" = { name = "Combat", to = "Damage", note = "both roll a to-dam bonus and nothing else" }
"70:17" = { name = "Enchant Weapon Skill", to = "Enchant Weapon To-Hit" }
"70:18" = { name = "Enchant Weapon Deadliness", to = "Enchant Weapon To-Dam" }

# --------------------------------------------------------------- rejects
#
# Nothing is listed here: the one category that needed rejecting -- Zangband's
# artifact bases -- is caught by a rule rather than by name, since seven of the
# rings it applies to are all called "Ring". See the INSTA_ART test in
# cmd_objects.

[reject]
"70:51" = { name = "Rumour", why = """Rejected by DEC-41 rather than deferred: \
it adds nothing worth the curation. Zangband's 647 rumours are in the archive \
and the machinery to hold them is the shape of `hints.txt`, so the mechanism \
was never the obstacle -- but a good many of the lines name things this game \
has not got or contradict what it does, and a scroll whose whole purpose is to \
tell the player something true is the wrong place for text that is false. \
Sorting the true from the false is 647 judgements for one flavour scroll.""" }

# ---------------------------------------------------------------- defers
#
# Kinds whose defining property has no 4.2 mechanism. Each names what is
# missing rather than being quietly dropped, and none is a case where a
# substitute would be the same item.

[defer]

# The ten statues are one decision, not ten. Zangband's statue is a monster
# rendered in a material: the `#` in the name is replaced by the monster's name
# and `pval` holds its race index (object2.c:3179). 4.2 object names are fixed
# strings and `struct object` has no monster reference, so a Wooden Statue
# without the interpolation is a 200-pound piece of wood with no content in it.
"9:0" = { name = "Wooden Statue of #", why = "statue" }
"9:1" = { name = "Clay Statue of #", why = "statue" }
"9:2" = { name = "Stone Statue of #", why = "statue" }
"9:3" = { name = "Iron Statue of #", why = "statue" }
"9:4" = { name = "Copper Statue of #", why = "statue" }
"9:5" = { name = "Silver Statue of #", why = "statue" }
"9:6" = { name = "Golden Statue of #", why = "statue" }
"9:7" = { name = "Ivory Statue of #", why = "statue" }
"9:8" = { name = "Mithril Statue of #", why = "statue" }
"9:9" = { name = "Ornate Statue of #", why = "statue" }

"8:0" = { name = "Magical Figurine of #", why = "statue", note = """Thrown, it \
breaks and summons the monster named in its `pval` as a pet \
(cmd2.c:2209 -- `summon_named_creature(x, y, o_ptr->pval, FALSE, FALSE, TRUE)`, \
where the last argument is `pet`). Two halves were missing: the monster in the \
name, as with the statues, and the pet. **The pet half arrived with PLR-22 in \
3.67.0** and the other half did not: 4.2 has no object type whose name \
interpolates a monster race, and no `TV_FIGURINE` to hang one on. Re-filed \
under "statue" in 3.72.0, with the ten statues, because that is the one wall \
still standing -- and because a figurine is a statue that does something, so \
whatever solves them solves this.""" }

"65:17" = { name = "Tame Monster", why = "built 3.72.0", note = """\
`charm_monster(dir, 45)` -- the monster becomes a pet. Deferred through \
3.71.0 for want of monster allegiance; built on the MON_CHARM projection when \
PLR-22 brought it. The power is a flat 45 rather than the caster's level, \
which is what the wand's own line says and is why it is worth carrying at any \
level: it beats a level 15 monster's saving throw about nine times in ten.""" }

"70:52" = { name = "Artifact Creation", why = "no 4.2 effect", note = """\
`artifact_scroll()` turns an ordinary item in the pack into a random \
artifact during play. 4.2 generates its random artifacts once, at birth, from \
the savefile seed; there is no path that makes one mid-game.""" }

"65:29" = { name = "Rockets", why = "no 4.2 element", note = """`GF_ROCKET` \
is its own damage type: it stuns unless the target resists sound, and is \
halved by shard resistance (spells1.c:3535). 4.2 has no rocket element, and \
adding one means an entry in list-elements.h -- which is indexed into \
`el_info[]` and written to the savefile by position (save.c:177), for every \
object and every monster. Held deliberately: the wand is one item and the \
change reaches every savefile in the game.""" }

# ------------------------------------------------------------- effects
#
# The Lua on a consumable, as 4.2 effect lines. Each entry is the list of
# `key:value` pairs to append to the entry, in order; `dice:` and the rest
# follow the effect they belong to, exactly as in object.txt.
#
# Damage figures are Zangband's own. Its `fire_ball(GF_x, dir, dam, rad)`
# passes damage that the projection then divides by distance from the centre,
# so 350 at the centre of a radius-4 ball is not 350 to everything in it.

[effect]

"70:50" = { name = "Logrus", lines = [
    "effect:BALL:CHAOS:4",
    "dice:400",
    "effect:DAMAGE",
    "dice:150+d151",
], note = """`fire_ball(GF_CHAOS, 0, 400, 4)` centred on the reader, then \
`take_hit(rand_range(150, 300))` unless chaos-resistant. 4.2 has no \
conditional self-damage, so the second half is unconditional -- see the note \
in the report.""" }

"70:48" = { name = "Fire", lines = [
    "effect:BALL:FIRE:4",
    "dice:350",
    "effect:DAMAGE",
    "dice:100+d101",
], note = """`fire_ball(GF_FIRE, 0, 350, 4)`, then `take_hit(rand_range(100, \
200))` unless the reader's fire resistance is good enough. Same caveat as \
Logrus.""" }

"66:12" = { name = "Pesticide", lines = [
    "effect:BALL:POIS:3",
    "dice:8",
], note = "`fire_ball(GF_POIS, dir, 8, 3)`, unchanged." }

