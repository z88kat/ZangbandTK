# zconv overrides — hand-tuned values, reapplied on every conversion run.
#
# BAL-12: conversion is re-runnable and deterministic. Hand-edits are recorded
# here rather than applied to generated output directly, so that re-running the
# converter never silently discards tuning work.
#
# Keys are the monster's comparison key: the name lowercased, with any leading
# "& " and trailing "~" removed. Values replace whatever the converter chose,
# and appear in the report's "Overrides applied" section.
#
# Example:
#
#   [monster."grand master mystic"]
#   hit-points = 900
#   depth = 40
#
# Empty by design — nothing has been playtested yet.

[monster]

# Keyed by slot, as the object converter is: tval 75 (potion), sval 63.
[object."75:63"]
# Zangband's description promises two things and the port delivers one. The
# potion's Lua is `do_cmd_rerate(); cure_all_mutations()`; 4.2 fixes hit points
# at birth and has no rerate command, so the mutations go and the hit dice
# stay. Left as an override rather than edited into the generated file, and
# recorded here so the next reader can see the half that was dropped.
desc = "This potion strips away every mutation you carry. There is no other way to be rid of them all at once, and no cheap way to come by it."
