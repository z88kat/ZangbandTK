# Zangband object flags -> Angband 4.2's object property model.
#
# The two models differ structurally, not just in naming. Zangband carries one
# `pval` per item and a set of flags saying what it applies to; 4.2 gives every
# property its own value, splits properties across `flags:`, `values:`,
# `brand:`, `slay:` and `curse:` lines, and expresses immunity as resistance
# level 3 rather than a separate flag.
#
# Dispositions follow flagmap.toml's convention: every flag is placed or
# rejected with a reason, and the converter reports anything absent from here.

# ------------------------------------------------- values scaled by pval
# Emitted as values:NAME[pval]. Zangband applies its single pval to all of
# these at once, which is why an item granting +4 STR also grants +4 DEX.

[value_pval]
STR = "STR"
INT = "INT"
WIS = "WIS"
DEX = "DEX"
CON = "CON"
SPEED = "SPEED"
STEALTH = "STEALTH"
# Zangband's data files call the searching skill SENSE; its own C calls the same
# flag TR_SEARCH.  Not a monster-sensing power, whatever the name suggests.
SENSE = "SEARCH"
INFRA = "INFRA"
BLOWS = "BLOWS"
XTRA_MIGHT = "MIGHT"
XTRA_SHOTS = "SHOTS"

# --------------------------------------------------- values at fixed level
# Resistances are level 1; immunities are the same property at level 3.

[value_fixed]
# Zangband's LITE is a boolean: `if (FLAG(o_ptr, TR_LITE)) p_ptr->cur_lite++`
# (xtra1.c:2024). It is not scaled by pval, and reading it as one gave the
# Crown of Chaos a light radius of 125.
LITE       = { name = "LIGHT",      level = 1 }
RES_ACID   = { name = "RES_ACID",   level = 1 }
RES_ELEC   = { name = "RES_ELEC",   level = 1 }
RES_FIRE   = { name = "RES_FIRE",   level = 1 }
RES_COLD   = { name = "RES_COLD",   level = 1 }
RES_POIS   = { name = "RES_POIS",   level = 1 }
RES_LITE   = { name = "RES_LIGHT",  level = 1 }
RES_DARK   = { name = "RES_DARK",   level = 1 }
RES_NETHER = { name = "RES_NETHER", level = 1 }
RES_NEXUS  = { name = "RES_NEXUS",  level = 1 }
RES_CHAOS  = { name = "RES_CHAOS",  level = 1 }
RES_DISEN  = { name = "RES_DISEN",  level = 1 }
RES_SOUND  = { name = "RES_SOUND",  level = 1 }
RES_SHARDS = { name = "RES_SHARD",  level = 1 }
IM_FIRE    = { name = "RES_FIRE",   level = 3 }
IM_COLD    = { name = "RES_COLD",   level = 3 }
IM_ELEC    = { name = "RES_ELEC",   level = 3 }
IM_POIS    = { name = "RES_POIS",   level = 3 }

# ------------------------------------------------------------------ flags
# Boolean properties, emitted on the flags: line.

[flag]
SUST_STR = "SUST_STR"
SUST_INT = "SUST_INT"
SUST_WIS = "SUST_WIS"
SUST_DEX = "SUST_DEX"
SUST_CON = "SUST_CON"
FREE_ACT = "FREE_ACT"
SEE_INVIS = "SEE_INVIS"
HOLD_LIFE = "HOLD_LIFE"
REGEN = "REGEN"
FEATHER = "FEATHER"
SLOW_DIGEST = "SLOW_DIGEST"
TELEPATHY = "TELEPATHY"
BLESSED = "BLESSED"
# ZangbandTK implementations — see src/player-attack.c and object_property.txt.
VAMPIRIC = "VAMPIRIC"
VORPAL = "VORPAL"
CHAOTIC = "CHAOTIC"
# And the wearer's side of the monster auras and reflection — see src/mon-aura.c.
REFLECT = "REFLECT"
SH_FIRE = "SH_FIRE"
SH_ELEC = "SH_ELEC"
# The last of them — see src/player-attack.c, src/player-calcs.c and the
# enchant handler in src/effect-handler-general.c.
GHOUL_TOUCH = "GHOUL_TOUCH"
RETURN = "RETURN"
LUCK_10 = "LUCK_10"
EASY_ENCHANT = "EASY_ENCHANT"
# 4.2 has this one already, under its own name: an item meant to be thrown.
THROW = "THROWING"
# Zangband treats these as resistances; 4.2 as protections, and as flags.
RES_BLIND = "PROT_BLIND"
RES_CONF = "PROT_CONF"
RES_FEAR = "PROT_FEAR"
# Three more ZangbandTK implementations, added for the object import (CNT-11).
# See src/player-attack.c, src/player-util.c and src/cmd-cave.c.
NO_MAGIC = "NO_MAGIC"
STRANGE_LUCK = "STRANGE_LUCK"
PSI_CRIT = "PSI_CRIT"

# ----------------------------------------------------------------- brands

[brand]
BRAND_FIRE = "FIRE_3"
BRAND_COLD = "COLD_3"
BRAND_ELEC = "ELEC_3"
BRAND_POIS = "POIS_3"
BRAND_ACID = "ACID_3"

# ------------------------------------------------------------------ slays

[slay]
SLAY_EVIL = "EVIL_2"
SLAY_ANIMAL = "ANIMAL_2"
SLAY_ORC = "ORC_3"
SLAY_TROLL = "TROLL_3"
SLAY_GIANT = "GIANT_3"
SLAY_DEMON = "DEMON_3"
SLAY_DRAGON = "DRAGON_3"
SLAY_UNDEAD = "UNDEAD_3"
KILL_DRAGON = "DRAGON_5"
KILL_DEMON = "DEMON_5"
KILL_UNDEAD = "UNDEAD_5"

# ----------------------------------------------------------------- curses
# 4.2 models curses as named entries with a power, rather than as flags.

[curse]
AGGRAVATE = { name = "siren", power = 30 }
TELEPORT = { name = "teleportation", power = 30 }
DRAIN_EXP = { name = "dullness", power = 30 }
NO_TELE = { name = "anti-teleportation", power = 30 }
TY_CURSE = { name = "ancient and foul", power = 40 }
DRAIN_STATS = { name = "weakness", power = 30 }

# ---------------------------------------------------------------- rejects

[reject]
CHR = """4.2 removed charisma as a statistic in 4.2.0. Nothing to modify."""
SUST_CHR = """See CHR. There is no charisma to sustain."""

SP = """Grants bonus spell points. 4.2's object property model has no mana \
modifier — its eleven mods are stealth, searching, infravision, tunnelling, \
speed, damage reduction, blows, shots, might, moves and light."""

INSTA_ART = """Marks an object kind as always generating as an artifact. \
Meaningless on an entry that is already in artifact.txt."""

SHOW_MODS = """Display hint controlling whether to-hit and to-dam are shown. \
4.2 decides this itself from the object's kind."""

HIDE_TYPE = """Display hint suppressing the pval description. 4.2 describes \
each property separately, so there is nothing to hide."""

CURSED = """A generic 'is cursed' marker. 4.2 has no such state — an object is \
cursed by carrying named curses, which the specific curse flags supply."""

AUTO_CURSE = """Re-curses itself when uncursed. 4.2's curse model has no \
sticky curses; removal difficulty is a property of each named curse."""

HEAVY_CURSE = """Curse severity tier. 4.2 expresses severity as the power \
value on each named curse instead."""

PERMA_CURSE = """Permanently cursed, never removable. 4.2 has no permanent \
curse tier."""

QUESTITEM = """Marks an item as a quest reward that cannot be sold. Belongs \
with the quest system in M6, not with the object import."""

# -------------------------------------------------------------- implement

[implement]
# Blocked, not merely unbuilt.  Zangband gated the player's movement into walls
# on `tim.wraith_form || TR_PASS_WALL` (cmd1.c:2301) and 4.2 has neither: its
# only PASS_WALL is the monster race flag, and the player can never enter a
# wall by any route.  Carrying this means giving the player wall-phasing --
# movement, line of sight, the lot -- rather than reading a flag.
PASS_WALL = { milestone = "M3", note = "Wielder passes through walls. Needs player wall-movement, which 4.2 has no form of." }
ACTIVATE = { milestone = "M2", note = "Handled separately via act:/time: rather than as a flag." }

# ------------------------------------------------ ego-only object flags
# Flags that appear on ego types rather than artifacts.

[flag_ego]
# 4.2 accepts these directly on the flags: line, parsing them into element info.
IGNORE_ACID = "IGNORE_ACID"
IGNORE_ELEC = "IGNORE_ELEC"
IGNORE_FIRE = "IGNORE_FIRE"
IGNORE_COLD = "IGNORE_COLD"
# 4.2 has this exact flag, used by its own exploding ammunition.
EXPLODE = "EXPLODE"

[value_pval_ego]
TUNNEL = "TUNNEL"

# --------------------------------------------------- kind-only flags
# 4.2's *kind* flags, which live in a different set from object flags and are
# only legal on an object kind. The artifact and ego parsers read `flags:` into
# the object-flag set alone, so these are read by the object converter only --
# which costs nothing, since Zangband puts none of them on an artifact or ego.

[flag_kind]
# 4.2 has this one under the same name, and uses it on 22 of its own kinds.
EASY_KNOW = "EASY_KNOW"

# --------------------------------------------- random ability generation
#
# CNT-16 needs no implementation: 4.2 already generates random abilities at
# object creation, via the kind flags below, and uses them on its own egos.
# What Zangband's data does not record is *which* egos receive them — that
# lives in spoilers/randabil.txt prose rather than in e_info.txt.
#
# Per that documentation, of the eighteen imported ego types only these two
# grant random abilities.

[rand_ability]
"(Trump Weapon)" = { flags = ["RAND_POWER", "RAND_HI_RES"], note = "1-in-7 extra power, plus a chance of an extra resistance" }
"(Chaotic)" = { flags = ["RAND_HI_RES"], note = "a chance of an extra resistance" }

# ---------------------------------------- ego flags needing implementation


[defer_ego]
# All three of these named a blocker that has since shipped, so they are waiting
# on nothing but somebody picking them up.
PATRON = { milestone = "M7", requirement = "PLR-05", note = "Behaves differently for a Chaos Warrior, whose patron takes an interest. The class exists as of M7, so this is unblocked." }
WILD_SHOT = { milestone = "M4", requirement = "WLD-07", note = "Behaviour tied to wilderness terrain. The wilderness exists as of M4, so this is unblocked." }
WILD_WALK = { milestone = "M4", requirement = "WLD-07", note = "Behaviour tied to wilderness terrain. The wilderness exists as of M4, so this is unblocked." }
