  "RANDOM", "dice:2",
  "TIMED_INC:FAST", "dice:20+1d20",
  "TIMED_INC:SLOW", "dice:20+1d20" ]

[random.BANISH_ALL]
line = 1549
note = """Zangband banishes every monster in line of sight outright. 4.2's \
