effects = [ "CURE:CUT", "DAMAGE", "dice:1d$B", "expr:B:PLAYER_LEVEL:+ 0" ]

[random.WASTING]
line = 1699
note = """Zangband picks a random stat and drains it, permanently until \
restored. The wasting disease, and the reason nobody wants it."""
