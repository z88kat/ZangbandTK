[random.HALLU]
line = 1416
effects = [ "TIMED_INC:IMAGE", "dice:40+1d40" ]

[random.FLATULENT]
line = 1424
note = "A poison ball centred on the player, and everything nearby notices."
effects = [ "SPHERE:POIS:3", "dice:$B", "expr:B:PLAYER_LEVEL:+ 3", "WAKE" ]

[random.ATT_DEMON]
line = 1465
note = """One demon in six arrives friendly in Zangband. 4.2 has no pets, so \
all of them are hostile here -- which makes this mutation worse than \
