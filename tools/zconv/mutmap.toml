[STERILITY]
line = 1223
note = """Built in M9 as it said it would be, and the recorded reservation \
still stands: it reaches into monster generation to carry a single mutation. \
Zangband adds MAX_REPRO to `num_repro` rather than setting a flag, which makes \
this temporary -- breeding resumes once enough breeders die to bring the count \
back under `repro_monster_max`, the comparison mon-move.c:1077 makes. 4.2 keeps \
the same counter and the same check, so the same addition means the same thing. \
The 17-34 hit points are a separate DAMAGE effect in the chain rather than part \
of the sterilising, so an effect that stops breeding is only that; the killer \
string needed a `power-effect-msg` directive the power parsers had never \
grown."""
effects = [
  "STERILIZE",
  "DAMAGE", "dice:16+1d18", "msg:the strain of forcing abstinence" ]

