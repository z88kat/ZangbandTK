effects = [ "LOSE_MUTATION" ]

[random.WRAITH]
line = 1680
defer = """inc_wraith_form() turns the character incorporeal for a while: they \
pass through walls and take damage from doing it. 4.2 has no wraith form and \
no player-passes-walls state at all."""

[random.POLY_WOUND]
