# based on https://angband.readthedocs.io/en/latest/hacking/compiling.html#nintendo-ds-nintendo-3ds
name: Nintendo DS

on:
  push:
    branches: [ master ]
  pull_request:

# These jobs only read the repository to build it, so hold the token
# down to that rather than taking whatever the repository's default
# happens to be.
permissions:
  contents: read

jobs:
  _3ds:
    name: Nintendo 3DS
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - name: Clone Project
        uses: actions/checkout@v6

      - name: Extract Names from Makefile
        id: get_names
        shell: bash
        run: |
            progname=`cd src && make -f Makefile.3ds print-executable-name | sed -En 's/^our-executable-name=//p'`
            echo "progname=$progname" >> $GITHUB_OUTPUT

      - name: Build Nintendo 3DS (3dsx)
        shell: bash
        run: |
          pushd src/
          env CFLAGS="-Werror" make -f Makefile.3ds -j$(nproc)
          popd

      - name: Setup cxitool
        shell: bash
        run: |
          apt-get update && apt-get install -y build-essential automake autoconf autotools-dev
          git clone -b cxi-stuff https://github.com/devkitPro/3dstools/
          pushd 3dstools/
          ./autogen.sh
          ./configure
          make -j$(nproc) install
          popd

      - name: Setup makerom 
        shell: bash
        run: |
          apt-get update && apt-get install -y build-essential libmbedtls-dev liblzma-dev libyaml-dev
          git clone https://github.com/3DSGuy/Project_CTR/
          pushd Project_CTR/makerom
          make -j$(nproc) deps
          make -j$(nproc)
          cp -rv bin/makerom /usr/local/bin
          popd

      # The .cia is named for the game, not for the executable, and has a title
      # ID of its own.  The 000400000616E600 this step had came with the recipe
      # from upstream Angband and is Angband's, and a .cia installs over any
      # title with the same ID: this one would have replaced Angband on a 3DS
      # that had both.  The same reason the data is in /zangbandtk on the card
      # and not /angband.  scripts/build-3ds --cia makes the same .cia locally,
      # and the two must keep agreeing.  cxitool takes at most 8 characters for
      # --name, which Zangband just fits.
      #
      # No -icon for makerom.  It was given src/nds/icon.smdh from inside src,
      # which is not there, and makerom ignores -icon anyway when it builds a
      # .cia from a .cxi.  The icon and title come from the .smdh Makefile.3ds
      # builds into the .3dsx, which cxitool carries over.
      #
      # The quoting to get progname may be too simple-minded:  what if there
      # are single quotes in the steps.*.outputs.* stuff.
      - name: Build Nintendo 3DS (cia)
        shell: bash
        run: |
          prog='${{ steps.get_names.outputs.progname }}'
          pushd src/
          test -e "$prog".3dsx
          cxitool --name=Zangband --code=CTR-P-ZANGBAND --tid=0004000007A6B000 "$prog".3dsx "$prog".cxi
          makerom -v -f cia -o "$prog".cia -target t -i "$prog".cxi:0:0 -ignoresign
          test -e "$prog".cia
          popd

  blocksds:
    name: Nintendo DS (BlocksDS)
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-latest
    steps:
      - name: Clone Project
        uses: actions/checkout@v6

      - name: Build
        shell: bash
        run: |
          pushd src/
          make -f Makefile.blocksds -j$(nproc)
          popd

      # Keep the ROM.  This job proved the DS build compiles and then threw away
      # the only thing anyone could test with, so trying a change on hardware or
      # in an emulator meant cutting a release first.  Now every run leaves a ROM
      # to download.  The data files are not here: the game reads those off the
      # card, and a release carries them.
      - name: Upload the ROM
        uses: actions/upload-artifact@v6
        with:
          name: zangband-nds-rom
          path: src/Zangband.nds
          if-no-files-found: error
          retention-days: 14

