# Exercise src/Makefile.nmake.

name: nmake

on:
  push:
    branches: [ master ]
  pull_request:

# These jobs only read the repository to build it, so hold the token
# down to that rather than taking whatever the repository's default
# happens to be.
permissions:
  contents: read

jobs:
  build:
    name: Stock
    runs-on: windows-latest
    steps:
      - name: Add nmake and compiler to PATH
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x86

      - name: Clone Project
        uses: actions/checkout@v6

      - name: Build
        run: |
          cd src
          nmake /f Makefile.nmake
