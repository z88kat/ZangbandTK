name: pages

# Build the documentation and publish it to GitHub Pages.
#
# This is the deployment counterpart to docs.yaml.  That one runs on pull
# requests and fails on any Sphinx warning, so it is the gate; this one runs
# after a change has landed and publishes what the gate already approved.  It
# deliberately does not build with -W: a warning should block review, not take
# the published site offline.
#
# Publishing uses the artifact-based deployment (upload-pages-artifact and
# deploy-pages) rather than committing to a gh-pages branch.  The artifact is
# served exactly as uploaded, with no Jekyll pass, so no .nojekyll file is
# needed to protect Sphinx's _static directory.

on:
  push:
    branches:
      - master
    # Only the documentation and the version script affect the built site.
    paths:
      - 'docs/**'
      - 'scripts/version.sh'
      - '.github/workflows/pages.yaml'
  # Allow publishing by hand, which is also how the very first deployment is
  # most easily made.
  workflow_dispatch:

# GITHUB_TOKEN needs to be able to claim an OIDC token to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a queued run wait for one in progress rather than cancelling it, so a
# deployment is never abandoned half done.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      # Need the full history: conf.py takes the version from
      # scripts/version.sh, which is a git describe against the tags.
      - name: Clone Project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Build
        run: make -C docs -j$(nproc) html

      # enablement makes this workflow the authoritative source for the site.
      # It matters: with Pages set to deploy from a branch, GitHub ran Jekyll
      # over the docs directory and published docs/README.md as the whole site,
      # burying the built manual.  Forcing the source back to this workflow on
      # every run means that cannot happen again without someone changing it
      # back by hand.  The custom domain survives, and the CNAME file is copied
      # into the artifact below in any case.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The custom domain lives in the repository's Pages settings, and the
      # CNAME file at the top of the tree is what the settings page wrote there.
      # A workflow deployment publishes only what it uploads, so carry the file
      # into the artifact: without it the domain rests on the Pages setting
      # alone, and a deployment that disagrees with that setting can drop it.
      - name: Add CNAME
        run: cp CNAME docs/_build/html/CNAME

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
