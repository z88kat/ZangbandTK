name: msys2

on:
  push:
    branches: [ master ]
  pull_request:

# These jobs only read the repository to build it, so hold the token
# down to that rather than taking whatever the repository's default
# happens to be.
permissions:
  contents: read

jobs:
  stock:
    name: GCU
    runs-on: windows-latest
    defaults:
      # Reduce verbosity and always run with msys2 as the default shell.
      # See https://github.com/marketplace/actions/setup-msys2 .
      run:
        shell: msys2 {0}
    steps:
      - name: Set up prerequisites
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ncurses

      - name: Clone Project
        uses: actions/checkout@v6

      - name: Build with CMake/Ninja
        run: |
          mkdir build
          cd build
          cmake -G Ninja -DSUPPORT_GCU_FRONTEND=ON -DSUPPORT_STATIC_LINKING=ON ..
          ninja -j$(nproc)

  sdl:
    name: SDL2
    runs-on: windows-latest
    defaults:
      # Reduce verbosity and always run with msys2 as the default shell.
      # See https://github.com/marketplace/actions/setup-msys2 .
      run:
        shell: msys2 {0}
    steps:
      - name: Set up prerequisites
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-sdl2-compat
            mingw-w64-x86_64-sdl2-ttf
            mingw-w64-x86_64-sdl2-image
            mingw-w64-x86_64-sdl2-mixer

      - name: Clone Project
        uses: actions/checkout@v6

      # Linked dynamically, no longer statically.  Since MSYS2's rebuild of
      # SDL2_image and SDL2_mixer in November 2026, their static archives are
      # compiled against the DLL builds of libavif, libjxl, FLAC, FluidSynth
      # and libxmp, so they ask for those libraries' __imp_ pointers, which
      # only an import library provides: a -static link of them fails
      # whatever the game does.  No download is built this way (the Windows
      # ones use the Windows front end), so the job keeps its purpose, the
      # SDL2 front end and its sound building against MSYS2's current SDL.
      - name: Build with CMake/Ninja including sound
        run: |
          mkdir build-sound
          cd build-sound
          cmake -G Ninja -DSUPPORT_SDL2_FRONTEND=ON -DSUPPORT_SDL2_SOUND=ON ..
          ninja -j$(nproc)

  configure-win:
    runs-on: windows-latest
    # Bounded, because it is the only job that runs `ui/shimmer` and that suite
    # hangs on this platform about one run in three -- twice it took the whole
    # six-hour default and reported "the job has exceeded the maximum execution
    # time", which says nothing about what hung and burns a runner for six
    # hours. Fifteen minutes is generous: the job takes five and a half when it
    # is well. The hang itself is not fixed; this makes it fail quickly and
    # legibly instead of slowly and anonymously.
    timeout-minutes: 15
    defaults:
      # Reduce verbosity and always run with msys2 as the default shell.
      # See https://github.com/marketplace/actions/setup-msys2 .
      run:
        shell: msys2 {0}
    steps:
      - name: Set up prerequisites
        uses: msys2/setup-msys2@v2
        with:
          update: true
          # The libraries in src/win/lib and src/win/dll are 32-bit.
          msystem: mingw32
          install: >-
            autoconf-wrapper
            automake-wrapper
            make
            mingw-w64-i686-gcc

      - name: Clone Project
        uses: actions/checkout@v6

      - name: Build
        run: |
          ./autogen.sh
          ./configure --enable-win
          make -j$(nproc) install
          make -j$(nproc) tests

  cmake-win32:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Set up prerequisites
        uses: msys2/setup-msys2@v2
        with:
          update: true
          # The libraries in src/win/lib and src/win/dll are 32-bit, and they
          # are the only PNG this job has: in November 2026 MSYS2 cut its
          # 32-bit repository down to the compilers, the build tools and what
          # they need, and mingw-w64-i686-libpng went with the rest.  The
          # 32-bit download is built against the same bundled pair.
          msystem: MINGW32
          install: >-
            mingw-w64-i686-cmake
            mingw-w64-i686-ninja
            mingw-w64-i686-gcc

      - name: Clone Project
        uses: actions/checkout@v6

      - name: Configure with CMake/Ninja and the bundled PNG
        run: |
          mkdir build
          cd build
          cmake -G Ninja -DSUPPORT_WINDOWS_FRONTEND=ON -DSUPPORT_BUNDLED_PNG=ON ..

      - name: Build with Ninja
        run: |
          cd build
          ninja -j$(nproc)

      - name: Run Tests
        run: |
          cd build
          ninja -j$(nproc) alltests

      - name: Configure and build with static linking
        run: |
          mkdir build-static
          cd build-static
          cmake -G Ninja -DSUPPORT_WINDOWS_FRONTEND=ON -DSUPPORT_BUNDLED_PNG=ON -DSUPPORT_STATIC_LINKING=ON ..
          ninja -j$(nproc)

  cmake-win64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Set up prerequisites
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libpng

      - name: Clone Project
        uses: actions/checkout@v6

      - name: Configure with CMake/Ninja
        run: |
          mkdir build
          cd build
          cmake -G Ninja -DSUPPORT_WINDOWS_FRONTEND=ON ..

      - name: Build with Ninja
        run: |
          cd build
          ninja -j$(nproc)

      - name: Run Tests
        run: |
          cd build
          ninja -j$(nproc) alltests

      - name: Configure and build with static linking
        run: |
          mkdir build-static
          cd build-static
          cmake -G Ninja -DSUPPORT_WINDOWS_FRONTEND=ON -DSUPPORT_STATIC_LINKING=ON ..
          ninja -j$(nproc)

  asan-ubsan-clang64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Set up prerequisites
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: CLANG64
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-compiler-rt
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-libpng

      - name: Clone Project
        uses: actions/checkout@v6

      - name: Build with ASAN/UBSAN
        run: |
          mkdir build
          cd build
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address -fsanitize=undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -fno-lto -g" \
            ..
          ninja -j$(nproc) --verbose

      - name: Run Tests with ASAN/UBSAN
        run: |
          cd build
          ninja -j$(nproc) --verbose alltests
