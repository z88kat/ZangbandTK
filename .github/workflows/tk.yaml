name: Tk

# The Tcl/Tk front end.  macOS only for now, per decision 13 in
# .claude/plans/phase3-tcl-tk-frontend.md: all three platforms are the
# deliverable, macOS is the one being developed and tested by hand, and the
# Linux and Windows jobs land when there is a front end worth keeping green on
# them rather than a toolchain.
#
# It builds the toolchain, then the front end, then the application bundle, and
# runs both test suites -- the ones that need no window, and the scripted
# session at the end, which does.  A runner can open an Aqua window; that was
# an open question until the step below answered it.  See section 9 of the
# Phase 3 plan.

on:
  push:
    branches: [ master ]
    paths: &tk_paths
      - 'tcltk/**'
      - 'lib/tcl/**'
      - 'src/main-tcl.c'
      - 'src/tcl/**'
      - 'src/cmake/macros/TCL_Frontend.cmake'
      # The sound the Tk build compiles in on macOS, which no other job builds.
      - 'src/sound-core.c'
      - 'src/sound.h'
      - 'src/cocoa/snd-cocoa.m'
      # The keymap list the Keymaps window reads.
      - 'src/ui-keymap.c'
      - 'src/ui-keymap.h'
      - 'scripts/build-tcltk'
      - 'scripts/pkg_macos_tcltk'
      - 'scripts/dmg_macos_tcltk'
      - 'src/tcl/dmg-readme.txt'
      - 'scripts/run-tcl-tests'
      - 'scripts/run-tcl-bridge-test'
      - 'scripts/run-tcl-package-test'
      - 'scripts/pkg_linux_tcltk'
      - 'lib/icons/zangbandtk.desktop'
      - 'scripts/portraits/**'
      - 'scripts/palettes/**'
      - 'lib/gamedata/p_race.txt'
      - 'lib/gamedata/class.txt'
      - 'CMakeLists.txt'
      - '.github/workflows/tk.yaml'
  pull_request:
    paths: *tk_paths
  # The paths filters above mean a change to the game alone never runs this,
  # so allow it to be started by hand when something needs checking anyway.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolchain:
    name: Tcl/Tk 9.0.4
    runs-on: macos-latest
    steps:
      - name: Clone Project
        uses: actions/checkout@v6

      # Two minutes locally, and the sources are a pinned upstream release
      # that only changes when we deliberately move to a new one -- so key the
      # cache on the version and the script that builds it, and skip the build
      # entirely on a hit.
      - name: Cache the toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: tcltk/local
          key: tcltk-9.0.4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-tcltk') }}

      - name: Build Tcl and Tk
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/build-tcltk

      # Checked on every run, cache hit or not, because a cache that restores
      # an incomplete prefix is worse than no cache: the failure would surface
      # later, in the front-end build, as a missing header nobody expected.
      #
      # tkInt.h is the one that matters.  The ported widget library reaches
      # into Tk's private headers, `make install` does not install them, and a
      # toolchain without them compiles the front end on a developer's machine
      # -- where the source tree is right there -- and nowhere else.
      - name: Check the prefix
        run: |
          for f in include/tclInt.h include/tkInt.h \
                   lib/tclConfig.sh lib/tkConfig.sh \
                   bin/tclsh9.0 bin/wish9.0 ; do
            if [ ! -f tcltk/local/$f ]; then
              echo "tcltk/local/$f is missing." >&2
              exit 1
            fi
          done
          tcltk/local/bin/tclsh9.0 <<'EOF'
            if {[info patchlevel] ne "9.0.4"} {
              puts stderr "wrong Tcl: [info patchlevel]"
              exit 1
            }
            if {[catch {zipfs root}]} {
              puts stderr "no zipfs -- the release build packages its Tcl with it"
              exit 1
            }
            puts "tcl [info patchlevel], zipfs [zipfs root]"
          EOF

      # Aqua, not X11.  A Tk that quietly picked up an X11 header path would
      # build, run under XQuartz, and look nothing like a Mac application --
      # so assert the frameworks rather than trusting the configure flag.
      - name: Check Tk is Aqua
        run: |
          otool -L tcltk/local/bin/wish9.0
          if ! otool -L tcltk/local/bin/wish9.0 | grep -q Cocoa.framework ; then
            echo "wish does not link Cocoa -- this is not an Aqua build." >&2
            exit 1
          fi
          if otool -L tcltk/local/bin/wish9.0 | grep -qi 'libX11' ; then
            echo "wish links X11." >&2
            exit 1
          fi

  frontend:
    name: Front end and bundle
    runs-on: macos-latest
    needs: toolchain
    steps:
      - name: Clone Project
        uses: actions/checkout@v6

      - name: Restore the toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: tcltk/local
          key: tcltk-9.0.4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-tcltk') }}

      # Only on a cache miss -- the toolchain job above will normally have
      # filled it, but a job is not allowed to assume another one's cache.
      - name: Build Tcl and Tk
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/build-tcltk

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja \
            -DSUPPORT_TCL_FRONTEND=ON \
            -DTCLTK_PREFIX="$PWD/tcltk/local"
          cmake --build build --parallel

      # Asserted rather than assumed: CMakeLists auto-enables the X11 front end
      # when it thinks no graphical one was chosen, and a bundled application
      # gets no arguments with which to say -mtcl, so an X11 front end sneaking
      # back in would mean the .app launches XQuartz instead of itself.
      - name: Check the Tcl front end is the one that is in there
        run: |
          otool -L build/game/angband | grep -q libtcl9tk || {
            echo "The executable does not link Tk." >&2
            exit 1
          }
          if otool -L build/game/angband | grep -qi 'libX11'; then
            echo "The X11 front end came back." >&2
            exit 1
          fi

      - name: Tcl tests
        run: scripts/run-tcl-tests

      # The character portraits are made from scripts/portraits/art.py and
      # committed; this fails when the sheet is not what the art makes, or a
      # race or class in lib/gamedata has none.
      - name: Portraits are current
        run: python3 scripts/portraits/build-portraits.py --check

      # The Display page's palettes keep every difference the game gives a
      # meaning to -- the colour-blind one under simulated colour blindness
      # too -- and the high-contrast one stays readable on black.
      - name: Palettes pass their checks
        run: python3 scripts/palettes/check-palettes.py

      # Builds ZangbandTK.app and runs its own checks: that nothing in it
      # points back at the build tree, that the game data and the front end's
      # scripts are inside it, that the plist has no unsubstituted
      # placeholders left in it, and that its ad-hoc signature verifies.
      - name: Package the application bundle
        run: scripts/pkg_macos_tcltk build "$PWD/out"

      # The bundle, not the build tree, started with a script that asks where
      # Tcl, Tk and the front end's scripts came from: a bundle that reached
      # back to the runner's toolchain would pass everything above and fail on
      # every other Mac.
      - name: The bundle runs on what it carries
        run: |
          scripts/run-tcl-package-test out/ZangbandTK.app \
            out/ZangbandTK.app/Contents/MacOS/ZangbandTK

      # On a disk image, as a release ships it, so what is downloaded from
      # here is what a player would get: an .app uploaded as an artifact is
      # zipped and loses what its signature seals.  No manual inside -- the
      # release builds that first.
      - name: Put it on a disk image
        run: |
          version=$(sed -n 's/^#define VERSION_STRING[[:space:]]*"\(.*\)"/\1/p' src/buildid.h)
          scripts/dmg_macos_tcltk out/ZangbandTK.app "out/ZangbandTK-$version-osx-tk.dmg"

      - name: Upload the disk image
        uses: actions/upload-artifact@v4
        with:
          name: ZangbandTK-dmg
          path: out/*.dmg
          retention-days: 7

      # The only step here that needs a window: it starts the real game with
      # the real front end and drives the bridge from a script.
      #
      # It arrived as continue-on-error, because whether a GitHub runner can
      # open an Aqua window was an open question and a step that cannot fail is
      # worth nothing as a check.  It can: run 35324433664 on 18 September 2026
      # reported "Bridge checks passed" in a 1m26s workflow.  So the guard is
      # off and this is a gate like the rest.
      #
      # It has its own watchdog -- see the script.  A front end that fails to
      # start does not fail, it waits, and a job that hangs for six hours is a
      # worse outcome than a red one.
      - name: Scripted session
        run: scripts/run-tcl-bridge-test build

  # Linux, on X11.  Decision 13 of the Phase 3 plan: macOS through development,
  # all three platforms before release.  ubuntu-22.04 rather than latest, as
  # the release's Linux jobs are, because its glibc is the oldest the AppImage
  # will run on.  One job where the Mac has two: on a cache hit the toolchain
  # step has nothing to do.
  linux:
    name: Linux (X11) and AppImage
    runs-on: ubuntu-22.04
    env:
      # The game refuses to start in a locale that is not UTF-8.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Clone Project
        uses: actions/checkout@v6

      # X11 and Xft for Tk; zip for Tk's own build (scripts/build-tcltk says
      # why); Xvfb, a display for the game to open its window on; and libfuse2
      # to run linuxdeploy.
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxft-dev \
            libfontconfig1-dev zip xvfb xauth libfuse2 file

      # Keyed on the image, not on runner.os as the Mac's is: a toolchain built
      # on a newer Ubuntu and restored here would carry its newer glibc into
      # the AppImage.
      - name: Cache the toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: tcltk/local
          key: tcltk-9.0.4-ubuntu-22.04-${{ runner.arch }}-${{ hashFiles('scripts/build-tcltk') }}

      - name: Build Tcl and Tk
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/build-tcltk

      # The same headers the Mac job asks for, and an X11 Tk with Xft: without
      # Xft, Tk draws with the X server's core fonts, a few fixed sizes of
      # bitmap, and the panes' font sizes would mean nothing.
      - name: Check the prefix
        run: |
          for f in include/tclInt.h include/tkInt.h \
                   lib/tclConfig.sh lib/tkConfig.sh \
                   bin/tclsh9.0 bin/wish9.0 ; do
            if [ ! -f tcltk/local/$f ]; then
              echo "tcltk/local/$f is missing." >&2
              exit 1
            fi
          done
          ldd tcltk/local/lib/libtcl9tk9.0.so
          ldd tcltk/local/lib/libtcl9tk9.0.so | grep -q libXft || {
            echo "Tk was built without Xft." >&2
            exit 1
          }

      # -Werror, as the other Linux builds have: GCC warns where the Mac's
      # clang does not, and this is the only GCC build of main-tcl.c.
      # USE_PRIVATE_PATHS because the AppImage is read only, so the saves go
      # to ~/.angband/ZangbandTK, as the other AppImage's do.
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE="-O2 -DNDEBUG -Werror -DUSE_PRIVATE_PATHS" \
            -DSUPPORT_TCL_FRONTEND=ON \
            -DTCLTK_PREFIX="$PWD/tcltk/local"
          cmake --build build --parallel

      # The X11 front end coming back is the Mac job's worry too, and here it
      # would be the first module tried; Tk links X11 itself, so ask the cache
      # rather than the executable.
      - name: Check the Tcl front end is the one that is in there
        run: |
          ldd build/game/angband | grep -q libtcl9tk || {
            echo "The executable does not link Tk." >&2
            exit 1
          }
          if grep -q '^SUPPORT_X11_FRONTEND:BOOL=ON' build/CMakeCache.txt; then
            echo "The X11 front end came back." >&2
            exit 1
          fi

      - name: Tcl tests
        run: scripts/run-tcl-tests

      - name: Scripted session
        run: xvfb-run -a -s "-screen 0 1600x1200x24" scripts/run-tcl-bridge-test build

      - name: Install linuxdeploy
        run: |
          curl -sSLo /usr/local/bin/linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod a+x /usr/local/bin/linuxdeploy
          linuxdeploy --version

      - name: Package the AppImage
        run: |
          version=$(sed -n 's/^#define VERSION_STRING[[:space:]]*"\(.*\)"/\1/p' src/buildid.h)
          scripts/pkg_linux_tcltk build "ZangbandTK-$version"

      # The AppImage's own contents, started through its own AppRun, asked
      # where Tcl, Tk and the front end's scripts came from -- the check the
      # bridge session cannot make, since it runs the build tree.
      - name: The AppImage runs on what it carries
        run: |
          ./ZangbandTK-*-linux64-tk.AppImage --appimage-extract >/dev/null
          xvfb-run -a -s "-screen 0 1600x1200x24" \
            scripts/run-tcl-package-test squashfs-root squashfs-root/AppRun

      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ZangbandTK-AppImage
          path: ZangbandTK-*-linux64-tk.AppImage
          retention-days: 7
