name: create-github-release

# Releases are cut by pushing a version tag, not by landing on master.  Pull
# requests still build everything below, so a release that cannot be built is
# caught before there is a tag naming it; only the final publishing step is
# restricted to tag pushes.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  pull_request:
  # Every job but the last, started by hand: a rehearsal of a release, which
  # publishes nothing, because the release job runs only for a pushed tag.
  workflow_dispatch:

# Creating a release writes to the repository, and the token does not get that
# by default -- the repository hands workflows read-only contents unless they
# ask, which is why publishing failed with "Resource not accessible by
# integration" while every build job before it succeeded.  Ask at the job that
# needs it rather than here, so nothing else in this file can write.
permissions:
  contents: read

env:
    # Used as the name when uploading or downloading the artifact for passing
    # configuration data from the Setup job to those dependent on it.
    CONFIG_ARTIFACT: release-config
    # Used as the path for the file with the configuration data passed from
    # the Setup job to those dependent on it.
    CONFIG_ARTIFACT_PATH: release-config.txt
    # Used as the name when uploading or downloading the artifact with the
    # converted document files.
    DOC_ARTIFACT: release-docs
    # Used as the path for the file with the converted document files.
    DOC_ARTIFACT_PATH: release-docs.tar
    # Used as the name when uploading or downloading the artifact for passing
    # the name of the source archive.
    SRC_ARTIFACT: release-src
    # Used as the path for the file with the name of the source archive in it.
    SRC_ARTIFACT_PATH: release-src.txt
    # Used as the name when uploading or downloading the artifact holding
    # the source archive.
    SRC_ARCHIVE_ARTIFACT: release-src-archive
    # Used as the name when uploading or downloading the artifact for passing
    # the name of the Nintendo archive, which holds both the DS and 3DS builds.
    NIN_ARTIFACT: release-nintendo
    # Used as the path for the file with the name of the Nintendo archive.
    NIN_ARTIFACT_PATH: release-nintendo.txt
    # Used as the name when uploading or downloading the artifact holding
    # the Nintendo archive.
    NIN_ARCHIVE_ARTIFACT: release-nintendo-archive
    # Used as the name when uploading or downloading the artifact for passing
    # the name of the Linux AppImage.
    LINUX_ARTIFACT: release-linux
    # Used as the path for the file with the name of the Linux AppImage.
    LINUX_ARTIFACT_PATH: release-linux.txt
    # Used as the name when uploading or downloading the artifact holding
    # the Linux AppImage.
    LINUX_ARCHIVE_ARTIFACT: release-linux-archive
    # Used as the name when uploading or downloading the artifact for passing
    # the name of the Linux terminal archive.
    LINTTY_ARTIFACT: release-linux-terminal
    # Used as the path for the file with the name of the Linux terminal archive.
    LINTTY_ARTIFACT_PATH: release-linux-terminal.txt
    # Used as the name when uploading or downloading the artifact holding
    # the Linux terminal archive.
    LINTTY_ARCHIVE_ARTIFACT: release-linux-terminal-archive
    # Used as the name when uploading or downloading the artifact for passing
    # the name of the 32-bit Windows archive.
    WIN32_ARTIFACT: release-win32
    # Used as the path for the file with the name of the 32-bit Windows archive.
    WIN32_ARTIFACT_PATH: release-win32.txt
    # Used as the name when uploading or downloading the artifact holding
    # the 32-bit Windows archive.
    WIN32_ARCHIVE_ARTIFACT: release-win32-archive
    # The same three, for the 64-bit Windows archive.
    WIN64_ARTIFACT: release-win64
    WIN64_ARTIFACT_PATH: release-win64.txt
    WIN64_ARCHIVE_ARTIFACT: release-win64-archive
    # Used as the name when uploading or downloading the artifact for passing
    # the name of the Mac archive.
    MAC_ARTIFACT: release-mac
    # Used as the path for the file with the name of the Mac archive in it.
    MAC_ARTIFACT_PATH: release-mac.txt
    # Used as the name when uploading or downloading the artifact holding
    # the Mac archive.
    MAC_ARCHIVE_ARTIFACT: release-mac-archive
    # Used as the name when uploading or downloading the artifact for passing
    # the name of the Mac terminal archive.
    MACTTY_ARTIFACT: release-mac-terminal
    # Used as the path for the file with the name of the Mac terminal archive.
    MACTTY_ARTIFACT_PATH: release-mac-terminal.txt
    # Used as the name when uploading or downloading the artifact holding
    # the Mac terminal archive.
    MACTTY_ARCHIVE_ARTIFACT: release-mac-terminal-archive
    # The same three again for the Intel Mac archive, which is a separate
    # download rather than a second slice inside the Apple Silicon one.
    MACINTEL_ARTIFACT: release-mac-intel
    MACINTEL_ARTIFACT_PATH: release-mac-intel.txt
    MACINTEL_ARCHIVE_ARTIFACT: release-mac-intel-archive
    # And for the Intel Mac terminal archive.
    MACTTYINTEL_ARTIFACT: release-mac-terminal-intel
    MACTTYINTEL_ARTIFACT_PATH: release-mac-terminal-intel.txt
    MACTTYINTEL_ARCHIVE_ARTIFACT: release-mac-terminal-intel-archive
    # And for ZangbandTK.app, the Tk front end's own image.
    MACTK_ARTIFACT: release-mac-tk
    MACTK_ARTIFACT_PATH: release-mac-tk.txt
    MACTK_ARCHIVE_ARTIFACT: release-mac-tk-archive
    # And for ZangbandTK on Linux and on Windows.
    LINUXTK_ARTIFACT: release-linux-tk
    LINUXTK_ARTIFACT_PATH: release-linux-tk.txt
    LINUXTK_ARCHIVE_ARTIFACT: release-linux-tk-archive
    WINTK_ARTIFACT: release-win-tk
    WINTK_ARTIFACT_PATH: release-win-tk.txt
    WINTK_ARCHIVE_ARTIFACT: release-win-tk-archive
    # Used as the name when uploading or downloading the artifact for passing
    # the name of the DOS archive.
    DOS_ARTIFACT: release-dos
    # Used as the path for the file with the name of the DOS archive.
    DOS_ARTIFACT_PATH: release-dos.txt
    # Used as the name when uploading or downloading the artifact holding
    # the DOS archive.
    DOS_ARCHIVE_ARTIFACT: release-dos-archive

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      # Need commit history and tags for scripts/version.sh to work as expected
      # so use 0 for fetch-depth.
      - name: Clone Project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Need automake and autoconf to initialize the build system and make to
      # extract the names.
      - name: Install Build Dependencies
        id: build_dep
        run: |
          sudo apt-get update
          sudo apt-get install cmake ninja-build gcc libx11-dev

      - name: Initialize the Build System
        id: build_init
        run: |
          cmake -S . -B build -G Ninja

      - name: Extract Names from the Build System
        id: get_names
        run: |
          prog=$(cmake --build build --target print-executable-name | sed -En 's/^our-executable-name=//p')
          echo "prog=$prog" >> $GITHUB_OUTPUT
          # The released files are named for the game.  That is not the CMake
          # project name, which is still Angband and stays so deliberately: it
          # is lowercased into the executable name and built into the install
          # paths, so renaming it would move where the game looks for its data.
          # Makefile.osx's DISPLAY_NAME is the one place the game's own name is
          # written down, so take it from there and keep the two in step.
          name=$(sed -En 's/^DISPLAY_NAME[[:space:]]*=[[:space:]]*//p' src/Makefile.osx)
          test -n "$name"
          echo "name=$name" >> $GITHUB_OUTPUT
          # Two downloads are not the game's (DEC-143).  The Tk image carries
          # the Tk application, which is ZangbandTK, so it is named from the
          # NAME that scripts/pkg_macos_tcltk gives the bundle.  The source
          # archive is the whole project, both applications, so it is named
          # for the project: VERSION_NAME, which also names the folder the
          # characters are kept in.  Neither is called anything ending in
          # "name": the jobs read this back with sed 's/name= //p', which would
          # find that too.
          tkapp=$(sed -En 's/^NAME=//p' scripts/pkg_macos_tcltk)
          test -n "$tkapp"
          echo "tkapp=$tkapp" >> $GITHUB_OUTPUT
          project=$(sed -En 's/^#define VERSION_NAME[[:space:]]*"(.*)"/\1/p' src/buildid.h)
          test -n "$project"
          echo "project=$project" >> $GITHUB_OUTPUT

      # On a tag push the tag is the version, verbatim.  Do not use
      # scripts/version.sh for it: that is a git describe, so it only returns
      # the bare tag for an annotated one and otherwise yields a string like
      # angband-base-38-g07c532c8c, which is a build id and no way to name a
      # release.  Pull request builds have no tag and keep the describe string,
      # which is correct for them -- they are not published.
      - name: Set Release Version
        id: get_release_vars
        run: |
          if test "${{ github.ref_type }}" = tag ; then
              version="${{ github.ref_name }}"
          else
              version=`scripts/version.sh`
          fi
          echo "version=$version" >> $GITHUB_OUTPUT
          # Decided by the shape of the version: a plain X.Y.Z is a full
          # release, and anything else -- 3.140.0-rc1 -- is a prerelease.
          # From 3.1.1 to 3.94.3 every release was marked a prerelease
          # whatever its tag, because the game had not been played through
          # and whole Zangband features were missing, and GitHub's badge is
          # the one place somebody sees that before they download.  3.138.0,
          # the first with ZangbandTK, is the version the owner stands behind
          # without that qualification, so the test is back.
          prerelease=`echo $version | awk '/^[0-9]+\.[0-9]+\.[0-9]+$/ { print "false" ; exit 0 } ; { print "true"; exit 0 } ;'`
          echo "prerelease=$prerelease" >> $GITHUB_OUTPUT
          # Nothing is drafted.  Upstream drafts a final release so that a
          # human can write its notes before anybody sees it, and publishes
          # prereleases outright -- which is the wrong way round for a project
          # whose download page sends people to the Releases page.  3.1.1 was
          # built, signed, verified and attached, and then sat invisible to
          # everyone without push access: a draft is hidden however public the
          # repository is, so the page the manual points at looked empty and the
          # asset URLs answered 404.  The body comes from --generate-notes when
          # the release is made, and the written account of a version is the
          # release log in the manual.
          draft=false
          echo "draft=$draft" >> $GITHUB_OUTPUT

      # The quoting here may be too simple-minded:  what if there are single
      # quotes in the steps.*.outputs.* stuff.
      - name: Create Artifact with Configuration Details
        run: |
          echo name= '${{ steps.get_names.outputs.name }}' > $CONFIG_ARTIFACT_PATH
          echo tkapp= '${{ steps.get_names.outputs.tkapp }}' >> $CONFIG_ARTIFACT_PATH
          echo project= '${{ steps.get_names.outputs.project }}' >> $CONFIG_ARTIFACT_PATH
          echo prog= '${{ steps.get_names.outputs.prog }}' >> $CONFIG_ARTIFACT_PATH
          echo version= '${{ steps.get_release_vars.outputs.version }}' >> $CONFIG_ARTIFACT_PATH
          echo prerelease= '${{ steps.get_release_vars.outputs.prerelease }}' >> $CONFIG_ARTIFACT_PATH
          echo draft= '${{ steps.get_release_vars.outputs.draft }}' >> $CONFIG_ARTIFACT_PATH

      - name: Upload Artifact for Use by Dependent Steps
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.CONFIG_ARTIFACT }}
          path: ${{ env.CONFIG_ARTIFACT_PATH }}
          retention-days: 1

  docconvert:
    name: Document Conversion
    runs-on: ubuntu-latest
    steps:
      # Need commit history and tags for scripts/version.sh to work as expected
      # so use 0 for fetch-depth.  Do this before installing the build
      # dependencies as that step does some writing to the current directory
      # and cloning the project wipes the current directory.
      - name: Clone Project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The documents need Sphinx, a theme and two extensions, and the set of
      # them is docs/requirements.txt -- install from there rather than naming
      # any of it here, so that this cannot drift from what conf.py imports.
      # It did drift: this job installed sphinx-better-theme and no extensions,
      # so it failed every run once the theme changed, and took the whole
      # release with it.  setup-python also removes the reason for the
      # sphinx-build shim this step used to build, since its virtual environment
      # is on PATH rather than having to be reached into.
      #
      # cmake, gcc, ninja and libx11-dev are for configuring and building; git
      # is for scripts/version.sh.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt
          sudo apt-get update
          sudo apt-get install -y cmake gcc ninja-build libx11-dev git

      - name: Convert
        run: |
          cmake -S . -B build -G Ninja -DBUILD_DOC=ON -DSPHINX_EXECUTABLE=`which sphinx-build`
          cmake --build build --parallel --target OurManual

      - name: Archive
        run: |
          tar -cf ${{ env.DOC_ARTIFACT_PATH }} \
            --transform='s|^manual-output/html|docs/_build/html|' \
            -C build manual-output/html

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.DOC_ARTIFACT }}
          path: ${{ env.DOC_ARTIFACT_PATH }}
          retention-days: 1

  source:
    needs: setup
    name: Source Archive
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact with Configuration Information
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CONFIG_ARTIFACT }}

      - name: Extract Configuration Information and Store in Step Outputs
        id: store_config
        run: |
          name=`sed -E -n -e 's/name= //p' $CONFIG_ARTIFACT_PATH`
          echo "name=$name" >> $GITHUB_OUTPUT
          prog=`sed -E -n -e 's/prog= //p' $CONFIG_ARTIFACT_PATH`
          echo "prog=$prog" >> $GITHUB_OUTPUT
          version=`sed -E -n -e 's/version= //p' $CONFIG_ARTIFACT_PATH`
          echo "version=$version" >> $GITHUB_OUTPUT
          project=`sed -E -n -e 's/project= //p' $CONFIG_ARTIFACT_PATH`
          echo "project=$project" >> $GITHUB_OUTPUT

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install git

      # Need commit history and tags for scripts/version.sh to work as expected
      # so use 0 for fetch-depth.
      - name: Clone Project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Named for the project rather than the game (DEC-143): the source
      # builds both applications, Zangband and ZangbandTK.
      - name: Create source archive (CMake-era)
        id: create_source_archive
        run: |
          archive_prefix=${{ steps.store_config.outputs.project }}-${{ steps.store_config.outputs.version }}

          # Export tracked files only
          git archive \
            --prefix=${archive_prefix}/ \
            --format=tar \
            HEAD \
            | tar -x

          # Generate version file
          scripts/version.sh > ${archive_prefix}/version

          # Generate autotools files in the exported tree
          (
            cd ${archive_prefix}
            ./autogen.sh
            rm -rf autom4te.cache autogen.sh
          )

          # Create compressed archive
          tar \
            --exclude .github \
            --exclude .gitignore \
            --exclude .travis.yml \
            -czvf ${archive_prefix}.tar.gz \
            ${archive_prefix}

          rm -rf ${archive_prefix}

          echo "archive_file=${archive_prefix}.tar.gz" >> $GITHUB_OUTPUT

      - name: Create Artifact with Source Archive Path
        run: |
          echo archive_path= '${{ steps.create_source_archive.outputs.archive_file }}' > $SRC_ARTIFACT_PATH

      - name: Upload Artifact with Source Archive Path
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.SRC_ARTIFACT }}
          path: ${{ env.SRC_ARTIFACT_PATH }}
          retention-days: 1

      - name: Upload Source Archive as Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.SRC_ARCHIVE_ARTIFACT }}
          path: ${{ steps.create_source_archive.outputs.archive_file }}
          retention-days: 1

  nds:
    needs: [setup]
    name: Nintendo DS
    runs-on: ubuntu-latest
    # BlocksDS, not devkitARM.  Makefile.blocksds reaches into
    # /opt/blocksds/core for mkfatimg and ndstool, which the devkitARM image
    # does not carry; the 3DS build below needs devkitARM and does not have
    # BlocksDS.  Two toolchains, so two jobs.
    container: skylyrac/blocksds:slim-latest
    steps:
      - name: Clone Project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build
        shell: bash
        run: |
          cd src
          env CFLAGS="-Werror" make -f Makefile.blocksds -j$(nproc)
          test -e Zangband.nds

      - name: Upload the ROM
        uses: actions/upload-artifact@v6
        with:
          name: release-nds-rom
          path: src/Zangband.nds
          retention-days: 1

  n3ds:
    needs: [setup]
    name: Nintendo 3DS
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - name: Clone Project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build
        shell: bash
        run: |
          cd src
          env CFLAGS="-Werror" make -f Makefile.3ds -j$(nproc)
          test -e angband.3dsx

      - name: Upload the Executable
        uses: actions/upload-artifact@v6
        with:
          name: release-3ds-exe
          path: src/angband.3dsx
          retention-days: 1

  nintendo:
    needs: [setup, nds, n3ds]
    name: Nintendo Archive
    # Only assembling a zip, so no toolchain container is needed here.
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact with Configuration Information
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CONFIG_ARTIFACT }}

      - name: Extract Configuration Information and Store in Step Outputs
        id: store_config
        run: |
          name=`sed -E -n -e 's/name= //p' $CONFIG_ARTIFACT_PATH`
          echo "name=$name" >> $GITHUB_OUTPUT
          version=`sed -E -n -e 's/version= //p' $CONFIG_ARTIFACT_PATH`
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Clone Project
        uses: actions/checkout@v6

      - name: Download the ROM
        uses: actions/download-artifact@v8
        with:
          name: release-nds-rom

      - name: Download the 3DS Executable
        uses: actions/download-artifact@v8
        with:
          name: release-3ds-exe

      # The data the card needs, and only that.  lib is 24 MB, of which 19 MB is
      # tilesets and 3.2 MB is audio, and this is a text build that can open
      # neither -- copying all of it, as the job this replaces did, made a 24 MB
      # download that was 22 MB of files the DS would never read.
      #
      # The folder is named for the project, not the game (DEC-143), because
      # main-nds.c looks for its data at /zangbandtk/lib on the card, and both
      # builds share that file.
      - name: Create Nintendo Archive
        id: create_nintendo_archive
        run: |
          archive_prefix=${{ steps.store_config.outputs.name }}-${{ steps.store_config.outputs.version }}
          mkdir -p zangbandtk/lib/user/save
          for d in gamedata help screens customize ; do
            cp -R lib/$d zangbandtk/lib/
          done
          # The DS has 4 MB and the desktop world does not fit in it: the game
          # loads, reaches character creation and then fails generating the
          # surface.  These overrides shrink the live chunk, the world and the
          # town count for this build only; the reasons are in the file.  It
          # fails the build if an entry has been renamed rather than shipping a
          # value the machine cannot hold.
          scripts/nds_constants zangbandtk/lib/gamedata/constants.txt
          mv Zangband.nds ${archive_prefix}.nds
          mv angband.3dsx ${archive_prefix}.3dsx
          sed -e "s/<version>/${{ steps.store_config.outputs.version }}/g" \
            src/nds/card-readme.txt > README.txt
          # The C libraries and the console libraries linked into the two
          # executables, whose licences ask for their notices in every copy:
          # BlocksDS's for the DS, devkitPro's for the 3DS.
          scripts/third-party-notices -n Zangband THIRD-PARTY-LICENSES.txt \
            libnds fatfs picolibc libctru newlib
          zip -9 -r ${archive_prefix}-nintendo.zip \
            ${archive_prefix}.nds ${archive_prefix}.3dsx \
            zangbandtk LICENSE.md THIRD-PARTY-LICENSES.txt README.txt
          echo "archive_file=${archive_prefix}-nintendo.zip" >> $GITHUB_OUTPUT
          ls -lh ${archive_prefix}-nintendo.zip

      - name: Create Artifact with Nintendo Archive Path
        run: |
          echo archive_path= '${{ steps.create_nintendo_archive.outputs.archive_file }}' > $NIN_ARTIFACT_PATH

      - name: Upload Artifact with Nintendo Archive Path
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.NIN_ARTIFACT }}
          path: ${{ env.NIN_ARTIFACT_PATH }}
          retention-days: 1

      - name: Upload Nintendo Archive as Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.NIN_ARCHIVE_ARTIFACT }}
          path: ${{ steps.create_nintendo_archive.outputs.archive_file }}
          retention-days: 1

  linux:
    needs: [setup, docconvert]
    name: Linux (AppImage, ${{ matrix.arch }})
    # A binary is bound to the glibc it was built against and will not start on
    # anything older, so the build runs on Ubuntu 18.04, inside the container
    # scripts/in-oldest-linux starts, rather than on the runner: the oldest
    # runner GitHub has is 22.04, and glibc 2.35 shut out a player on an older
    # distribution who wanted to play.  That puts the floor at 2.27.  The
    # runner itself only holds the container and the steps that need GitHub's
    # own actions.
    #
    # Twice, as are the other two Linux jobs: for x86-64, and for 64-bit ARM --
    # a Raspberry Pi, an ARM laptop, a Linux VM on an Apple Silicon Mac, none
    # of which can start an x86-64 file.  The ARM leg runs on GitHub's ARM
    # runner, where the container is ARM too, so nothing is emulated.  Its
    # files have -arm on the end, as the Intel Mac's have -intel, and so do
    # its artifacts, so that the release job can fetch both legs'.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-22.04
            platform: linux/amd64
            elf: x86-64
            suffix: ''
          - arch: ARM
            runner: ubuntu-22.04-arm
            platform: linux/arm64
            elf: ARM aarch64
            suffix: -arm
    runs-on: ${{ matrix.runner }}
    env:
      # Which image scripts/in-oldest-linux builds and runs.
      OLDEST_LINUX_PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Download Artifact with Configuration Information
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CONFIG_ARTIFACT }}

      - name: Extract Configuration Information and Store in Step Outputs
        id: store_config
        run: |
          name=`sed -E -n -e 's/name= //p' $CONFIG_ARTIFACT_PATH`
          echo "name=$name" >> $GITHUB_OUTPUT
          version=`sed -E -n -e 's/version= //p' $CONFIG_ARTIFACT_PATH`
          echo "version=$version" >> $GITHUB_OUTPUT

      # Need commit history and tags for scripts/version.sh to work as expected
      # so use 0 for fetch-depth.
      - name: Clone Project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Artifact with Converted Documents
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.DOC_ARTIFACT }}

      # scripts/pkg_appimage puts the manual in the image if it is there.
      - name: Extract Converted Documents
        run: |
          tar -xf ${{ env.DOC_ARTIFACT_PATH }}

      # SDL2 and the three libraries beside it, built from source: 18.04's own
      # are 2017's, older than the SDL2 front end compiles against.  Keyed on
      # the image they are built in as well as the script, as tk.yaml keys its
      # toolchain, so that nothing built on a newer base is restored here.
      - name: Cache SDL2
        id: cache-sdl2
        uses: actions/cache@v4
        with:
          path: sdl2/local
          key: sdl2-oldest-linux-${{ hashFiles('scripts/oldest-linux/Dockerfile') }}-${{ runner.arch }}-${{ hashFiles('scripts/build-sdl2') }}

      - name: Build SDL2
        if: steps.cache-sdl2.outputs.cache-hit != 'true'
        run: scripts/in-oldest-linux scripts/build-sdl2

      # One binary carrying three front ends, chosen at run time with -m: SDL2
      # for tiles, X11 for a plain window, and GCU so the game is playable over
      # a terminal with no display at all.  Linux is the only platform here
      # where that choice exists, and it costs nothing but link time.
      #
      # SC_INSTALL is what makes the data path ./lib, relative to the working
      # directory, which is what lets AppRun find it inside the mounted image;
      # an absolute path baked at build time would point outside it.  But
      # SC_INSTALL alone would also put the saves in there, and the image is
      # read only, so USE_PRIVATE_PATHS is added by hand to send the save,
      # score and panic directories to the user's home instead.  CMake only
      # defines that for READONLY_INSTALL, which cannot be used here because it
      # is the mode with the absolute paths.
      #
      # GCU_STATIC_CURSES as the terminal download has it, so the curses front
      # end in here is that one exactly, and 18.04's ncurses is not one more
      # library from 2018 for the image to carry.
      - name: Build
        run: |
          scripts/in-oldest-linux env PKG_CONFIG_PATH="$PWD/sdl2/local/lib/pkgconfig" \
            cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE="-O2 -DNDEBUG -Werror -DUSE_PRIVATE_PATHS" \
            -DSC_INSTALL=ON \
            -DSUPPORT_SDL2_FRONTEND=ON \
            -DSUPPORT_SDL2_SOUND=ON \
            -DSUPPORT_X11_FRONTEND=ON \
            -DSUPPORT_GCU_FRONTEND=ON \
            -DGCU_STATIC_CURSES=ON
          scripts/in-oldest-linux cmake --build build --parallel

      # Confirm all three front ends really are in the binary before packaging
      # one that silently has fewer, since CMake reports a missing front end as
      # a status message and carries on.
      - name: Check the Front Ends
        run: |
          help=$(scripts/in-oldest-linux ./build/game/angband -h 2>&1 || true)
          for m in sdl2 x11 gcu ; do
            if ! echo "$help" | grep -q -- "$m" ; then
              echo "Front end $m is missing from the build." >&2
              exit 1
            fi
          done

      - name: Create Linux Archive
        id: create_linux_archive
        run: |
          archive_prefix=${{ steps.store_config.outputs.name }}-${{ steps.store_config.outputs.version }}
          archive_file=${archive_prefix}-linux64${{ matrix.suffix }}.AppImage
          scripts/in-oldest-linux scripts/pkg_appimage $archive_prefix $archive_file
          echo "archive_file=$archive_file" >> $GITHUB_OUTPUT

      # An AppImage that cannot start is indistinguishable from a broken
      # download, so start it -- on a stock Ubuntu 18.04, the oldest system it
      # promises to run on, with nothing installed but what any desktop has.
      # The curses front end plays into the dungeon; the SDL2 one opens its
      # window on a virtual display and has to still be running when looked at
      # again, which it would not be if the SDL it carries could not find a
      # video driver, its font or its PNG decoder.  And every file in the
      # image is checked against the glibc the download page promises.
      - name: Smoke Test
        run: |
          ./${{ steps.create_linux_archive.outputs.archive_file }} --appimage-extract >/dev/null
          test -f squashfs-root/usr/share/ZangbandTK/lib/gamedata/constants.txt
          test -x squashfs-root/usr/bin/zangband
          file squashfs-root/usr/bin/zangband | grep -q "${{ matrix.elf }}"
          scripts/check-glibc-floor squashfs-root
          docker run --rm \
            -v "$PWD/squashfs-root:/game:ro" \
            -v "$PWD/scripts/smoke-tty:/smoke-tty:ro" \
            ubuntu:18.04 \
            sh -c 'apt-get update -qq >/dev/null && \
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
                python3 libx11-6 libgl1-mesa-dri xvfb xauth >/dev/null && \
              cp -R /game /play && python3 /smoke-tty /play AppRun && \
              LANG=C.UTF-8 SDL_AUDIODRIVER=dummy xvfb-run -a sh -c "
                /play/AppRun -msdl2 -n -uWindowTest & pid=\$!
                sleep 15
                kill -0 \$pid || { echo The SDL2 front end did not stay up. >&2; exit 1; }
                echo The SDL2 front end is up.
                kill \$pid"'

      - name: Create Artifact with Linux Archive Path
        run: |
          echo archive_path= '${{ steps.create_linux_archive.outputs.archive_file }}' > $LINUX_ARTIFACT_PATH

      - name: Upload Artifact with Linux Archive Path
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.LINUX_ARTIFACT }}${{ matrix.suffix }}
          path: ${{ env.LINUX_ARTIFACT_PATH }}
          retention-days: 1

      - name: Upload Linux Archive as Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.LINUX_ARCHIVE_ARTIFACT }}${{ matrix.suffix }}
          path: ${{ steps.create_linux_archive.outputs.archive_file }}
          retention-days: 1

  linux-terminal:
    needs: [setup, docconvert]
    name: Linux (terminal, ${{ matrix.arch }})
    # Built on Ubuntu 18.04 through scripts/in-oldest-linux, for the reason the
    # AppImage job gives: the executable is bound to the glibc it was built
    # against.  That is 2.27, which the README in the archive states.  For
    # x86-64 and ARM, as the AppImage job explains.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-22.04
            platform: linux/amd64
            elf: x86-64
            suffix: ''
          - arch: ARM
            runner: ubuntu-22.04-arm
            platform: linux/arm64
            elf: ARM aarch64
            suffix: -arm
    runs-on: ${{ matrix.runner }}
    env:
      OLDEST_LINUX_PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Download Artifact with Configuration Information
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CONFIG_ARTIFACT }}

      - name: Extract Configuration Information and Store in Step Outputs
        id: store_config
        run: |
          name=`sed -E -n -e 's/name= //p' $CONFIG_ARTIFACT_PATH`
          echo "name=$name" >> $GITHUB_OUTPUT
          version=`sed -E -n -e 's/version= //p' $CONFIG_ARTIFACT_PATH`
          echo "version=$version" >> $GITHUB_OUTPUT

      # Need commit history and tags for scripts/version.sh to work as expected
      # so use 0 for fetch-depth.
      - name: Clone Project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Artifact with Converted Documents
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.DOC_ARTIFACT }}

      # scripts/pkg_linux_tty puts the manual in the archive if it is there.
      - name: Extract Converted Documents
        run: |
          tar -xf ${{ env.DOC_ARTIFACT_PATH }}

      # The curses front end on its own -- no SDL2, no X11.  The AppImage job
      # above already builds a binary that has all three, so this is not about
      # reaching the terminal front end; it is about handing somebody an
      # executable and its data with nothing else in the way, for a server
      # where the AppImage is the wrong shape.
      #
      # SC_INSTALL makes the data path ./lib relative to the working directory,
      # which is what lets the unpacked archive be moved anywhere;
      # USE_PRIVATE_PATHS then sends the saves to the player's home rather than
      # inside it.  Both are as the AppImage job explains at greater length.
      #
      # GCU_STATIC_CURSES is the one that is specific to shipping a bare
      # executable.  A dynamically linked curses build is bound to the exact
      # ncurses on the machine that built it: it will not start at all on a
      # Debian system without libncursesw.so.6, and on the RPM distributions it
      # starts but prints "no version information available" on every launch.
      # Nothing here wants X11 or SDL2: that is the point of this build.
      - name: Build
        run: |
          scripts/in-oldest-linux cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE="-O2 -DNDEBUG -Werror -DUSE_PRIVATE_PATHS" \
            -DSC_INSTALL=ON \
            -DSUPPORT_GCU_FRONTEND=ON \
            -DGCU_STATIC_CURSES=ON
          scripts/in-oldest-linux cmake --build build --parallel

      - name: Create Linux Terminal Archive
        id: create_linux_terminal_archive
        run: |
          archive_prefix=${{ steps.store_config.outputs.name }}-${{ steps.store_config.outputs.version }}
          archive_file=${archive_prefix}-linux64-terminal${{ matrix.suffix }}.tar.gz
          scripts/in-oldest-linux scripts/pkg_linux_tty $archive_prefix $archive_file
          echo "archive_file=$archive_file" >> $GITHUB_OUTPUT
          echo "package_name=$archive_prefix" >> $GITHUB_OUTPUT

      - name: Unpack the Archive
        run: |
          mkdir -p unpacked
          tar -xzf ${{ steps.create_linux_terminal_archive.outputs.archive_file }} -C unpacked

      # pkg_linux_tty refuses to package a dynamically linked curses, so this
      # is belt and braces -- but it is checking the file that is actually
      # going to be uploaded rather than the one in the build tree.
      - name: Check the Executable Stands Alone
        run: |
          root=unpacked/${{ steps.create_linux_terminal_archive.outputs.package_name }}
          ldd $root/zangband
          if ldd $root/zangband | grep -qE 'libncurses|libtinfo|libX11|libSDL'; then
            echo "The executable depends on a library it should have linked in or never wanted." >&2
            exit 1
          fi
          file $root/zangband | grep -q "${{ matrix.elf }}"
          scripts/check-glibc-floor $root

      # Play it, on two distributions that are not the one it was built on:
      # the oldest it promises to run on, and a current one.  That the curses
      # library is linked in is the step above's to prove, not this one's --
      # installing python3 brings Debian's libncursesw.so.6 in with it.
      - name: Smoke Test on Other Distributions
        run: |
          root=unpacked/${{ steps.create_linux_terminal_archive.outputs.package_name }}
          test -f $root/lib/gamedata/constants.txt
          test -f $root/README.txt
          test -n "$(ls -A $root/docs)"
          for distribution in ubuntu:18.04 debian:12; do
            echo "== $distribution"
            docker run --rm \
              -v "$PWD/$root:/game:ro" \
              -v "$PWD/scripts/smoke-tty:/smoke-tty:ro" \
              $distribution \
              sh -c 'apt-get update -qq >/dev/null && \
                DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 >/dev/null && \
                cp -R /game /play && python3 /smoke-tty /play'
          done

      - name: Create Artifact with Linux Terminal Archive Path
        run: |
          echo archive_path= '${{ steps.create_linux_terminal_archive.outputs.archive_file }}' > $LINTTY_ARTIFACT_PATH

      - name: Upload Artifact with Linux Terminal Archive Path
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.LINTTY_ARTIFACT }}${{ matrix.suffix }}
          path: ${{ env.LINTTY_ARTIFACT_PATH }}
          retention-days: 1

      - name: Upload Linux Terminal Archive as Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.LINTTY_ARCHIVE_ARTIFACT }}${{ matrix.suffix }}
          path: ${{ steps.create_linux_terminal_archive.outputs.archive_file }}
          retention-days: 1

  windows32:
    needs: [setup, docconvert]
    name: Windows (32-bit)
    runs-on: ubuntu-22.04
    steps:
      - name: Download Artifact with Configuration Information
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CONFIG_ARTIFACT }}

      - name: Extract Configuration Information and Store in Step Outputs
        id: store_config
        run: |
          name=`sed -E -n -e 's/name= //p' $CONFIG_ARTIFACT_PATH`
          echo "name=$name" >> $GITHUB_OUTPUT
          prog=`sed -E -n -e 's/prog= //p' $CONFIG_ARTIFACT_PATH`
          echo "prog=$prog" >> $GITHUB_OUTPUT
          version=`sed -E -n -e 's/version= //p' $CONFIG_ARTIFACT_PATH`
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64 cmake ninja-build git zip

      # Need commit history and tags for scripts/version.sh to work as expected
      # so use 0 for fetch-depth.
      - name: Clone Project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Artifact with Converted Documents
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.DOC_ARTIFACT }}

      # scripts/pkg_win reads the built manual out of docs/_build/html.
      - name: Extract Converted Documents
        run: |
          tar -xf ${{ env.DOC_ARTIFACT_PATH }}

      # A 32-bit build, which is what the toolchain file in toolchains/ is for
      # and what runs on every Windows worth supporting, 64-bit included.  A
      # 64-bit build is wanted as well and needs its own toolchain file and its
      # own set of DLLs, so it is deliberately left for later rather than
      # half-done here.
      #
      # -O2 rather than the default -g -O2: the debugging information is most of
      # the executable, taking it from about 12 MB to about 3 MB, and nobody
      # downloading a release is going to debug it.
      - name: Create Windows Archive
        id: create_windows_archive
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE="-O2 -DNDEBUG -Werror" \
            -DSUPPORT_WINDOWS_FRONTEND=ON \
            -DSUPPORT_BUNDLED_PNG=ON \
            -DCMAKE_TOOLCHAIN_FILE=toolchains/linux-i686-mingw32-cross.cmake
          cmake --build build --parallel
          # The executable is named for the CMake project, which is still
          # Angband and stays that way because it also names the install paths.
          # Nobody should have to find angband.exe in a Zangband download, and
          # the Windows build locates its data relative to its own directory
          # rather than by its name, so renaming it here is safe.  pkg_win takes
          # whatever *.exe it finds.
          cp build/game/${{ steps.store_config.outputs.prog }}.exe \
            ${{ steps.store_config.outputs.name }}.exe
          cp build/game/libpng12.dll build/game/zlib1.dll .
          archive_prefix=${{ steps.store_config.outputs.name }}-${{ steps.store_config.outputs.version }}
          echo "archive_file=${archive_prefix}-win32.zip" >> $GITHUB_OUTPUT
          scripts/pkg_win $archive_prefix ${archive_prefix}-win32.zip

      - name: Create Artifact with Windows Archive Path
        run: |
          echo archive_path= '${{ steps.create_windows_archive.outputs.archive_file }}' > $WIN32_ARTIFACT_PATH

      - name: Upload Artifact with Windows Archive Path
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.WIN32_ARTIFACT }}
          path: ${{ env.WIN32_ARTIFACT_PATH }}
          retention-days: 1

      - name: Upload Windows Archive as Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.WIN32_ARCHIVE_ARTIFACT }}
          path: ${{ steps.create_windows_archive.outputs.archive_file }}
          retention-days: 1

  windows64:
    needs: [setup, docconvert]
    name: Windows (64-bit)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Built on a Windows runner under MSYS2 rather than cross-compiled on
      # Ubuntu like the 32-bit one.  The reason is libpng: the bundled PNG and
      # zlib in src/win/dll are 32-bit binaries and cannot be linked into a
      # 64-bit executable, and Ubuntu has no cross-built libpng for
      # x86_64-w64-mingw32 to use in their place.  MSYS2 packages one, so
      # pkg-config finds it and CMake's own non-bundled path does the rest.
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-pkgconf
            git
            zip

      - name: Download Artifact with Configuration Information
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CONFIG_ARTIFACT }}

      - name: Extract Configuration Information and Store in Step Outputs
        id: store_config
        run: |
          name=`sed -E -n -e 's/name= //p' $CONFIG_ARTIFACT_PATH`
          echo "name=$name" >> $GITHUB_OUTPUT
          prog=`sed -E -n -e 's/prog= //p' $CONFIG_ARTIFACT_PATH`
          echo "prog=$prog" >> $GITHUB_OUTPUT
          version=`sed -E -n -e 's/version= //p' $CONFIG_ARTIFACT_PATH`
          echo "version=$version" >> $GITHUB_OUTPUT

      # Need commit history and tags for scripts/version.sh to work as expected
      # so use 0 for fetch-depth.
      - name: Clone Project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Artifact with Converted Documents
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.DOC_ARTIFACT }}

      # scripts/pkg_win reads the built manual out of docs/_build/html.
      - name: Extract Converted Documents
        run: |
          tar -xf ${{ env.DOC_ARTIFACT_PATH }}

      # Static linking is not a size preference, it is what makes the zip
      # correct.  CMake's PNG detection reports no runtime DLLs for a
      # pkg-config library -- it says as much in a comment: it does not attempt
      # to guess them -- so a dynamically linked build would need libpng,
      # zlib, libwinpthread and whatever else they pull in copied out of
      # /mingw64/bin by hand, and any one of them missed is a download that
      # will not start.  Linked in, there is nothing to miss.
      - name: Create Windows Archive
        id: create_windows_archive
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE="-O2 -DNDEBUG -Werror" \
            -DSUPPORT_WINDOWS_FRONTEND=ON \
            -DSUPPORT_STATIC_LINKING=ON
          cmake --build build --parallel
          # Renamed for the same reason as the 32-bit build: it is built as
          # angband.exe, after the CMake project name, and nobody should have
          # to work out which file to run.
          cp build/game/${{ steps.store_config.outputs.prog }}.exe \
            ${{ steps.store_config.outputs.name }}.exe
          archive_prefix=${{ steps.store_config.outputs.name }}-${{ steps.store_config.outputs.version }}
          echo "archive_file=${archive_prefix}-win64.zip" >> $GITHUB_OUTPUT
          scripts/pkg_win $archive_prefix ${archive_prefix}-win64.zip

      # Confirm the executable really is 64-bit and really is self-contained,
      # rather than trusting the build flags to have meant what they said.
      - name: Check the Executable
        run: |
          file ${{ steps.store_config.outputs.name }}.exe
          file ${{ steps.store_config.outputs.name }}.exe | grep -q "x86-64"
          if objdump -p ${{ steps.store_config.outputs.name }}.exe |
              grep -E "DLL Name: (libpng|zlib|libwinpthread|libgcc)" ; then
            echo "Executable depends on a MinGW DLL that is not in the zip." >&2
            exit 1
          fi

      - name: Create Artifact with Windows Archive Path
        run: |
          echo archive_path= '${{ steps.create_windows_archive.outputs.archive_file }}' > $WIN64_ARTIFACT_PATH

      - name: Upload Artifact with Windows Archive Path
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.WIN64_ARTIFACT }}
          path: ${{ env.WIN64_ARTIFACT_PATH }}
          retention-days: 1

      - name: Upload Windows Archive as Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.WIN64_ARCHIVE_ARTIFACT }}
          path: ${{ steps.create_windows_archive.outputs.archive_file }}
          retention-days: 1

  mac:
    needs: [setup, docconvert]
    name: Mac
    runs-on: macos-latest
    steps:
      - name: Download Artifact with Configuration Information
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CONFIG_ARTIFACT }}

      - name: Extract Configuration Information and Store in Step Outputs
        id: store_config
        run: |
          name=`sed -E -n -e 's/name= //p' $CONFIG_ARTIFACT_PATH`
          echo "name=$name" >> $GITHUB_OUTPUT
          prog=`sed -E -n -e 's/prog= //p' $CONFIG_ARTIFACT_PATH`
          echo "prog=$prog" >> $GITHUB_OUTPUT
          version=`sed -E -n -e 's/version= //p' $CONFIG_ARTIFACT_PATH`
          echo "version=$version" >> $GITHUB_OUTPUT

      # Need commit history and tags for scripts/version.sh to work as expected
      # so use 0 for fetch-depth.
      - name: Clone Project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Artifact with Converted Documents
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.DOC_ARTIFACT }}

      - name: Extract Converted Documents
        run: |
          tar -xf ${{ env.DOC_ARTIFACT_PATH }}

      # Makefile.osx sets ARCHS to arm64 deliberately, so no universal SDK is
      # needed here.  Override the default OPT (-O2) to get the equivalent of
      # what --enable-release does for builds using configure.
      # The bundle inside the disk image is signed ad-hoc by the dist target
      # itself, which is the only place it can be done: dist depends on install,
      # and install copies the executable into the bundle every time it runs, so
      # anything signed here would be overwritten on the way into the image.
      # PACKAGE_NAME is passed in rather than left to the makefile to work out.
      # It would derive it from scripts/version.sh, which is a git describe and
      # so does not see a lightweight tag at all: tagging 3.1.1 without -a
      # leaves describe returning angband-base-56-g8bb164cb0, the image is named
      # after that, and the upload below then looks for a file that does not
      # exist.  The release version decided in setup is the authority here, and
      # this keeps the file's name and the name we go looking for in one place.
      - name: Create Mac Archive
        id: create_mac_archive
        run: |
          package_name=${{ steps.store_config.outputs.name }}-${{ steps.store_config.outputs.version }}
          cd src
          env OPT="-O2 -DNDEBUG -Werror" make -f Makefile.osx \
            -j$(sysctl -n hw.activecpu) PACKAGE_NAME="$package_name" dist
          echo "archive_file=${package_name}-osx.dmg" >> $GITHUB_OUTPUT

      # Fail the release rather than publish an image whose signature is not
      # coherent, since that is indistinguishable to a user from a corrupt
      # download.
      - name: Verify the Signature in the Image
        run: |
          hdiutil attach -quiet -readonly -mountpoint /tmp/zbtk-verify \
            ${{ steps.create_mac_archive.outputs.archive_file }}
          codesign --verify --strict --verbose=2 "/tmp/zbtk-verify/${{ steps.store_config.outputs.name }}.app"
          hdiutil detach -quiet /tmp/zbtk-verify

      - name: Create Artifact with Mac Archive Path
        run: |
          echo archive_path= '${{ steps.create_mac_archive.outputs.archive_file }}' > $MAC_ARTIFACT_PATH

      - name: Upload Artifact with Mac Archive Path
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.MAC_ARTIFACT }}
          path: ${{ env.MAC_ARTIFACT_PATH }}
          retention-days: 1

      - name: Upload Mac Archive as Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.MAC_ARCHIVE_ARTIFACT }}
          path: ${{ steps.create_mac_archive.outputs.archive_file }}
          retention-days: 1

  mac-terminal:
    needs: [setup, docconvert]
    name: Mac (terminal)
    runs-on: macos-latest
    steps:
      - name: Download Artifact with Configuration Information
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CONFIG_ARTIFACT }}

      - name: Extract Configuration Information and Store in Step Outputs
        id: store_config
        run: |
          name=`sed -E -n -e 's/name= //p' $CONFIG_ARTIFACT_PATH`
          echo "name=$name" >> $GITHUB_OUTPUT
          version=`sed -E -n -e 's/version= //p' $CONFIG_ARTIFACT_PATH`
          echo "version=$version" >> $GITHUB_OUTPUT

      # Need commit history and tags for scripts/version.sh to work as expected
      # so use 0 for fetch-depth.
      - name: Clone Project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Artifact with Converted Documents
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.DOC_ARTIFACT }}

      # Makefile.osx-tty's dist target puts docs/_build/html in the tarball if
      # it is there, so unpack the manual before building it.
      - name: Extract Converted Documents
        run: |
          tar -xf ${{ env.DOC_ARTIFACT_PATH }}

      # The curses build: the same game as the disk image, drawn with
      # characters, for playing in Terminal or over ssh.  A tarball rather than
      # a .dmg because there is no application bundle to mount -- it is one
      # executable and the data it reads.
      #
      # OPT carries -Werror for the same reason the Cocoa job's does, and
      # PACKAGE_NAME is passed in for the same reason too: left to itself the
      # makefile would take the version from scripts/version.sh, which is a git
      # describe and does not see a lightweight tag, so the file would be named
      # after a commit and the upload below would go looking for something that
      # does not exist.
      - name: Create Mac Terminal Archive
        id: create_mac_terminal_archive
        run: |
          package_name=${{ steps.store_config.outputs.name }}-${{ steps.store_config.outputs.version }}
          cd src
          env OPT="-O2 -DNDEBUG -Werror" make -f Makefile.osx-tty \
            -j$(sysctl -n hw.activecpu) PACKAGE_NAME="$package_name" dist
          echo "archive_file=${package_name}-osx-terminal.tar.gz" >> $GITHUB_OUTPUT
          echo "package_name=$package_name" >> $GITHUB_OUTPUT

      - name: Unpack the Archive
        run: |
          mkdir -p unpacked
          tar -xzf ${{ steps.create_mac_terminal_archive.outputs.archive_file }} -C unpacked

      # The failure this guards against does not show up on the machine that
      # builds it.  The runner has Homebrew, so a curses that resolves to
      # /opt/homebrew links happily here and then refuses to start for every
      # player who has no Homebrew, with a dyld error naming a path they have
      # never heard of.  Makefile.osx-tty asks for the system library on
      # purpose; this is what proves it got it.
      - name: Check for Homebrew Leakage
        run: |
          root=unpacked/${{ steps.create_mac_terminal_archive.outputs.package_name }}
          otool -L $root/zangband
          if otool -L $root/zangband | grep -qE '/opt/homebrew|/usr/local' ; then
            echo "The executable links a library outside /usr/lib." >&2
            exit 1
          fi
          file $root/zangband | grep -q arm64

      # An unsigned or incoherently signed executable is killed on sight by
      # macOS on Apple Silicon, so check the signature survived the trip
      # through tar rather than only checking it at the point it was applied.
      - name: Verify the Signature
        run: |
          root=unpacked/${{ steps.create_mac_terminal_archive.outputs.package_name }}
          codesign --verify --strict --verbose=2 $root/zangband

      # Everything above says the archive is well formed.  This says the game
      # in it runs: scripts/smoke-tty starts the curses front end on a
      # pseudo-terminal, makes a random character and checks it reaches a
      # generated level.  The data files are pruned by hand in the dist target
      # -- no tiles, no fonts, no sounds -- so the thing most likely to be
      # wrong is that too much was pruned, and nothing but starting the game
      # finds that out.
      - name: Smoke Test
        run: |
          root=unpacked/${{ steps.create_mac_terminal_archive.outputs.package_name }}
          test -f $root/lib/gamedata/constants.txt
          test -f $root/README.txt
          test -n "$(ls -A $root/docs)"
          scripts/smoke-tty $root

      - name: Create Artifact with Mac Terminal Archive Path
        run: |
          echo archive_path= '${{ steps.create_mac_terminal_archive.outputs.archive_file }}' > $MACTTY_ARTIFACT_PATH

      - name: Upload Artifact with Mac Terminal Archive Path
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.MACTTY_ARTIFACT }}
          path: ${{ env.MACTTY_ARTIFACT_PATH }}
          retention-days: 1

      - name: Upload Mac Terminal Archive as Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.MACTTY_ARCHIVE_ARTIFACT }}
          path: ${{ steps.create_mac_terminal_archive.outputs.archive_file }}
          retention-days: 1

  # The Intel Mac builds.  Two more jobs rather than a matrix over the
  # architecture, matching windows32 and windows64 and the rest of this file,
  # and because the runner label differs: macos-15-intel is a real Intel
  # machine, so the signature, the otool check and the smoke test all happen
  # natively, exactly as they do for Apple Silicon.  macos-latest cannot be
  # used -- it has meant arm64 since macos-14.
  #
  # Two thin downloads rather than one universal image is deliberate; see the
  # note in src/Makefile.osx.  The file names carry -intel, which the makefile
  # appends by itself when ARCHS is x86_64, so the two builds cannot overwrite
  # each other and a player can tell at a glance which one they have.
  mac-intel:
    needs: [setup, docconvert]
    name: Mac (Intel)
    runs-on: macos-15-intel
    steps:
      - name: Download Artifact with Configuration Information
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CONFIG_ARTIFACT }}

      - name: Extract Configuration Information and Store in Step Outputs
        id: store_config
        run: |
          name=`sed -E -n -e 's/name= //p' $CONFIG_ARTIFACT_PATH`
          echo "name=$name" >> $GITHUB_OUTPUT
          prog=`sed -E -n -e 's/prog= //p' $CONFIG_ARTIFACT_PATH`
          echo "prog=$prog" >> $GITHUB_OUTPUT
          version=`sed -E -n -e 's/version= //p' $CONFIG_ARTIFACT_PATH`
          echo "version=$version" >> $GITHUB_OUTPUT

      # Need commit history and tags for scripts/version.sh to work as expected
      # so use 0 for fetch-depth.
      - name: Clone Project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Artifact with Converted Documents
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.DOC_ARTIFACT }}

      - name: Extract Converted Documents
        run: |
          tar -xf ${{ env.DOC_ARTIFACT_PATH }}

      # Everything the Apple Silicon job does, with ARCHS=x86_64 added and the
      # image named for it.  OPT and PACKAGE_NAME are passed in for the reasons
      # spelled out on that job: the release flags, and a file name taken from
      # the version setup decided rather than from a git describe that does not
      # see a lightweight tag.
      - name: Create Intel Mac Archive
        id: create_mac_intel_archive
        run: |
          package_name=${{ steps.store_config.outputs.name }}-${{ steps.store_config.outputs.version }}
          cd src
          env OPT="-O2 -DNDEBUG -Werror" make -f Makefile.osx ARCHS=x86_64 \
            -j$(sysctl -n hw.activecpu) PACKAGE_NAME="$package_name" dist
          echo "archive_file=${package_name}-osx-intel.dmg" >> $GITHUB_OUTPUT

      # A build that succeeded still cannot tell you it built the architecture
      # asked for, and shipping an arm64 binary under a name that says Intel is
      # worse than shipping nothing.
      - name: Check the Architecture
        run: |
          file ${{ steps.store_config.outputs.name }}.app/Contents/MacOS/${{ steps.store_config.outputs.prog }}
          file ${{ steps.store_config.outputs.name }}.app/Contents/MacOS/${{ steps.store_config.outputs.prog }} \
            | grep -q x86_64

      # Fail the release rather than publish an image whose signature is not
      # coherent, since that is indistinguishable to a user from a corrupt
      # download.
      - name: Verify the Signature in the Image
        run: |
          hdiutil attach -quiet -readonly -mountpoint /tmp/zbtk-verify \
            ${{ steps.create_mac_intel_archive.outputs.archive_file }}
          codesign --verify --strict --verbose=2 "/tmp/zbtk-verify/${{ steps.store_config.outputs.name }}.app"
          hdiutil detach -quiet /tmp/zbtk-verify

      - name: Create Artifact with Intel Mac Archive Path
        run: |
          echo archive_path= '${{ steps.create_mac_intel_archive.outputs.archive_file }}' > $MACINTEL_ARTIFACT_PATH

      - name: Upload Artifact with Intel Mac Archive Path
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.MACINTEL_ARTIFACT }}
          path: ${{ env.MACINTEL_ARTIFACT_PATH }}
          retention-days: 1

      - name: Upload Intel Mac Archive as Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.MACINTEL_ARCHIVE_ARTIFACT }}
          path: ${{ steps.create_mac_intel_archive.outputs.archive_file }}
          retention-days: 1

  mac-terminal-intel:
    needs: [setup, docconvert]
    name: Mac (terminal, Intel)
    runs-on: macos-15-intel
    steps:
      - name: Download Artifact with Configuration Information
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CONFIG_ARTIFACT }}

      - name: Extract Configuration Information and Store in Step Outputs
        id: store_config
        run: |
          name=`sed -E -n -e 's/name= //p' $CONFIG_ARTIFACT_PATH`
          echo "name=$name" >> $GITHUB_OUTPUT
          version=`sed -E -n -e 's/version= //p' $CONFIG_ARTIFACT_PATH`
          echo "version=$version" >> $GITHUB_OUTPUT

      # Need commit history and tags for scripts/version.sh to work as expected
      # so use 0 for fetch-depth.
      - name: Clone Project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Artifact with Converted Documents
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.DOC_ARTIFACT }}

      # Makefile.osx-tty's dist target puts docs/_build/html in the tarball if
      # it is there, so unpack the manual before building it.
      - name: Extract Converted Documents
        run: |
          tar -xf ${{ env.DOC_ARTIFACT_PATH }}

      - name: Create Intel Mac Terminal Archive
        id: create_mac_terminal_intel_archive
        run: |
          package_name=${{ steps.store_config.outputs.name }}-${{ steps.store_config.outputs.version }}
          cd src
          env OPT="-O2 -DNDEBUG -Werror" make -f Makefile.osx-tty ARCHS=x86_64 \
            -j$(sysctl -n hw.activecpu) PACKAGE_NAME="$package_name" dist
          echo "archive_file=${package_name}-osx-terminal-intel.tar.gz" >> $GITHUB_OUTPUT
          echo "package_name=$package_name" >> $GITHUB_OUTPUT

      - name: Unpack the Archive
        run: |
          mkdir -p unpacked
          tar -xzf ${{ steps.create_mac_terminal_intel_archive.outputs.archive_file }} -C unpacked

      # Intel runners have Homebrew too, and in /usr/local rather than
      # /opt/homebrew, so a curses that resolved to it would link here and fail
      # on every machine without it -- the same failure the Apple Silicon job
      # guards against, from a different directory.
      - name: Check for Homebrew Leakage
        run: |
          root=unpacked/${{ steps.create_mac_terminal_intel_archive.outputs.package_name }}
          otool -L $root/zangband
          if otool -L $root/zangband | grep -qE '/opt/homebrew|/usr/local' ; then
            echo "The executable links a library outside /usr/lib." >&2
            exit 1
          fi
          file $root/zangband | grep -q x86_64

      # macOS does not kill an unsigned x86_64 binary on sight the way it does
      # an arm64 one, but the tarball is signed ad-hoc all the same and a
      # signature that did not survive tar is still a broken download.
      - name: Verify the Signature
        run: |
          root=unpacked/${{ steps.create_mac_terminal_intel_archive.outputs.package_name }}
          codesign --verify --strict --verbose=2 $root/zangband

      # As on Apple Silicon: the checks above say the archive is well formed,
      # and this says the game in it runs.  The data files are pruned by hand
      # in the dist target, so the thing most likely to be wrong is that too
      # much was pruned, and nothing but starting the game finds that out.
      - name: Smoke Test
        run: |
          root=unpacked/${{ steps.create_mac_terminal_intel_archive.outputs.package_name }}
          test -f $root/lib/gamedata/constants.txt
          test -f $root/README.txt
          test -n "$(ls -A $root/docs)"
          scripts/smoke-tty $root

      - name: Create Artifact with Intel Mac Terminal Archive Path
        run: |
          echo archive_path= '${{ steps.create_mac_terminal_intel_archive.outputs.archive_file }}' > $MACTTYINTEL_ARTIFACT_PATH

      - name: Upload Artifact with Intel Mac Terminal Archive Path
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.MACTTYINTEL_ARTIFACT }}
          path: ${{ env.MACTTYINTEL_ARTIFACT_PATH }}
          retention-days: 1

      - name: Upload Intel Mac Terminal Archive as Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.MACTTYINTEL_ARCHIVE_ARTIFACT }}
          path: ${{ steps.create_mac_terminal_intel_archive.outputs.archive_file }}
          retention-days: 1

  # ZangbandTK.app, the Tcl/Tk front end, beside Zangband.app rather than in
  # place of it (decision 14 of the Phase 3 plan).  Apple Silicon only for
  # now: an Intel image would need its own Tcl/Tk built on an Intel runner.
  #
  # Tcl and Tk come from the cache the Tk workflow fills, under the same key,
  # and are built here only when it is empty.  scripts/pkg_macos_tcltk makes
  # and signs the bundle -- ad-hoc, as Zangband.app is -- and refuses one
  # whose signature does not verify; scripts/dmg_macos_tcltk puts it on an
  # image with the manual, and checks the signature again on the copy inside.
  # The bridge test runs on this build too, since it is the one that ships.
  #
  # The image is named for this application, not for the game the other
  # downloads are named for (DEC-143), and keeps -osx-tk, so that it cannot be
  # taken for the ZangbandTK-<version>-osx.dmg that held Zangband.app, under
  # its old name, up to 3.128.0.
  mac-tk:
    needs: [setup, docconvert]
    name: Mac (Tk)
    runs-on: macos-latest
    steps:
      - name: Download Artifact with Configuration Information
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CONFIG_ARTIFACT }}

      - name: Extract Configuration Information and Store in Step Outputs
        id: store_config
        run: |
          tkapp=`sed -E -n -e 's/tkapp= //p' $CONFIG_ARTIFACT_PATH`
          echo "tkapp=$tkapp" >> $GITHUB_OUTPUT
          version=`sed -E -n -e 's/version= //p' $CONFIG_ARTIFACT_PATH`
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Clone Project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Artifact with Converted Documents
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.DOC_ARTIFACT }}

      - name: Extract Converted Documents
        run: |
          tar -xf ${{ env.DOC_ARTIFACT_PATH }}

      - name: Restore the Tcl/Tk toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: tcltk/local
          key: tcltk-9.0.4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-tcltk') }}

      - name: Build Tcl and Tk
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/build-tcltk

      - name: Build the game
        run: |
          cmake -S . -B build -G Ninja \
            -DSUPPORT_TCL_FRONTEND=ON \
            -DTCLTK_PREFIX="$PWD/tcltk/local" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Scripted session
        run: scripts/run-tcl-bridge-test build

      - name: Create Tk Mac Archive
        id: create_mac_tk_archive
        run: |
          tkapp=${{ steps.store_config.outputs.tkapp }}
          package_name=$tkapp-${{ steps.store_config.outputs.version }}
          scripts/pkg_macos_tcltk build "$RUNNER_TEMP/app"
          scripts/dmg_macos_tcltk "$RUNNER_TEMP/app/$tkapp.app" \
            "${package_name}-osx-tk.dmg"
          echo "archive_file=${package_name}-osx-tk.dmg" >> $GITHUB_OUTPUT

      # The bundle that goes on the image, started and asked where Tcl, Tk
      # and its scripts came from, as tk.yaml asks it on every push.
      - name: The bundle runs on what it carries
        run: |
          tkapp=${{ steps.store_config.outputs.tkapp }}
          scripts/run-tcl-package-test "$RUNNER_TEMP/app/$tkapp.app" \
            "$RUNNER_TEMP/app/$tkapp.app/Contents/MacOS/$tkapp"

      - name: Create Artifact with Tk Mac Archive Path
        run: |
          echo archive_path= '${{ steps.create_mac_tk_archive.outputs.archive_file }}' > $MACTK_ARTIFACT_PATH

      - name: Upload Artifact with Tk Mac Archive Path
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.MACTK_ARTIFACT }}
          path: ${{ env.MACTK_ARTIFACT_PATH }}
          retention-days: 1

      - name: Upload Tk Mac Archive as Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.MACTK_ARCHIVE_ARTIFACT }}
          path: ${{ steps.create_mac_tk_archive.outputs.archive_file }}
          retention-days: 1

  # ZangbandTK for Linux, as tk.yaml builds and checks it on every push:
  # ZangbandTK-<version>-linux64-tk.AppImage, from Tcl, Tk and SDL2 built here
  # on Ubuntu 18.04 through scripts/in-oldest-linux, whose glibc is the oldest
  # the AppImage runs on, as the other Linux downloads' is.  The bridge test
  # runs on this build too, under Xvfb, and the AppImage is started through its
  # own AppRun on 18.04 and asked where Tcl, Tk and its scripts came from.
  # For x86-64 and ARM, as the AppImage job explains.
  linux-tk:
    needs: [setup, docconvert]
    name: Linux (Tk, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-22.04
            platform: linux/amd64
            elf: x86-64
            suffix: ''
          - arch: ARM
            runner: ubuntu-22.04-arm
            platform: linux/arm64
            elf: ARM aarch64
            suffix: -arm
    runs-on: ${{ matrix.runner }}
    env:
      OLDEST_LINUX_PLATFORM: ${{ matrix.platform }}
      # The game refuses to start in a locale that is not UTF-8.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      # A runner has no sound card; SDL's dummy driver plays to nowhere, so
      # the sounds and the music are still loaded and played.
      SDL_AUDIODRIVER: dummy
    steps:
      - name: Download Artifact with Configuration Information
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CONFIG_ARTIFACT }}

      - name: Extract Configuration Information and Store in Step Outputs
        id: store_config
        run: |
          tkapp=`sed -E -n -e 's/tkapp= //p' $CONFIG_ARTIFACT_PATH`
          echo "tkapp=$tkapp" >> $GITHUB_OUTPUT
          version=`sed -E -n -e 's/version= //p' $CONFIG_ARTIFACT_PATH`
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Clone Project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Artifact with Converted Documents
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.DOC_ARTIFACT }}

      - name: Extract Converted Documents
        run: |
          tar -xf ${{ env.DOC_ARTIFACT_PATH }}

      # Both keyed on the image they are built in, as tk.yaml's are, so that
      # nothing built on a newer base is restored here.
      - name: Restore the Tcl/Tk toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: tcltk/local
          key: tcltk-9.0.4-oldest-linux-${{ hashFiles('scripts/oldest-linux/Dockerfile') }}-${{ runner.arch }}-${{ hashFiles('scripts/build-tcltk') }}

      - name: Restore SDL2
        id: cache-sdl2
        uses: actions/cache@v4
        with:
          path: sdl2/local
          key: sdl2-oldest-linux-${{ hashFiles('scripts/oldest-linux/Dockerfile') }}-${{ runner.arch }}-${{ hashFiles('scripts/build-sdl2') }}

      - name: Build Tcl and Tk
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/in-oldest-linux scripts/build-tcltk

      - name: Build SDL2
        if: steps.cache-sdl2.outputs.cache-hit != 'true'
        run: scripts/in-oldest-linux scripts/build-sdl2

      - name: Build the game
        run: |
          scripts/in-oldest-linux env PKG_CONFIG_PATH="$PWD/sdl2/local/lib/pkgconfig" \
            cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE="-O2 -DNDEBUG -Werror -DUSE_PRIVATE_PATHS" \
            -DSUPPORT_TCL_FRONTEND=ON \
            -DSUPPORT_SDL2_SOUND=ON \
            -DTCLTK_PREFIX="$PWD/tcltk/local"
          scripts/in-oldest-linux cmake --build build --parallel

      - name: Scripted session
        run: |
          scripts/in-oldest-linux \
            xvfb-run -a -s "-screen 0 1600x1200x24" scripts/run-tcl-bridge-test build

      - name: Create Tk Linux Archive
        id: create_linux_tk_archive
        run: |
          package_name=${{ steps.store_config.outputs.tkapp }}-${{ steps.store_config.outputs.version }}
          archive_file=${package_name}-linux64-tk${{ matrix.suffix }}.AppImage
          scripts/in-oldest-linux scripts/pkg_linux_tcltk build "$package_name" "$archive_file"
          echo "archive_file=$archive_file" >> $GITHUB_OUTPUT

      - name: The AppImage runs on what it carries
        run: |
          ./${{ steps.create_linux_tk_archive.outputs.archive_file }} --appimage-extract >/dev/null
          file squashfs-root/usr/bin/zangbandtk | grep -q "${{ matrix.elf }}"
          scripts/check-glibc-floor squashfs-root
          scripts/in-oldest-linux xvfb-run -a -s "-screen 0 1600x1200x24" \
            scripts/run-tcl-package-test squashfs-root squashfs-root/AppRun

      - name: Create Artifact with Tk Linux Archive Path
        run: |
          echo archive_path= '${{ steps.create_linux_tk_archive.outputs.archive_file }}' > $LINUXTK_ARTIFACT_PATH

      - name: Upload Artifact with Tk Linux Archive Path
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.LINUXTK_ARTIFACT }}${{ matrix.suffix }}
          path: ${{ env.LINUXTK_ARTIFACT_PATH }}
          retention-days: 1

      - name: Upload Tk Linux Archive as Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.LINUXTK_ARCHIVE_ARTIFACT }}${{ matrix.suffix }}
          path: ${{ steps.create_linux_tk_archive.outputs.archive_file }}
          retention-days: 1

  # ZangbandTK for Windows, as tk.yaml builds and checks it on every push:
  # ZangbandTK-<version>-win64-tk.zip, built with MinGW-w64 under MSYS2, as
  # the 64-bit Windows download is.  The bridge test runs on this build too,
  # and the folder the zip holds is started from its own ZangbandTK.exe and
  # asked where Tcl, Tk and its scripts came from.
  windows-tk:
    needs: [setup, docconvert]
    name: Windows (Tk)
    runs-on: windows-latest
    env:
      # A runner has no sound card; see the Linux job.
      SDL_AUDIODRIVER: dummy
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_mixer
            make
            zip

      - name: Download Artifact with Configuration Information
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CONFIG_ARTIFACT }}

      - name: Extract Configuration Information and Store in Step Outputs
        id: store_config
        run: |
          tkapp=`sed -E -n -e 's/tkapp= //p' $CONFIG_ARTIFACT_PATH`
          echo "tkapp=$tkapp" >> $GITHUB_OUTPUT
          version=`sed -E -n -e 's/version= //p' $CONFIG_ARTIFACT_PATH`
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Clone Project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Artifact with Converted Documents
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.DOC_ARTIFACT }}

      - name: Extract Converted Documents
        run: |
          tar -xf ${{ env.DOC_ARTIFACT_PATH }}

      - name: Restore the Tcl/Tk toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: tcltk/local
          key: tcltk-9.0.4-${{ runner.os }}-mingw64-${{ hashFiles('scripts/build-tcltk') }}

      - name: Build Tcl and Tk
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/build-tcltk

      - name: Build the game
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE="-O2 -DNDEBUG -Werror -DUSE_PRIVATE_PATHS" \
            -DSUPPORT_TCL_FRONTEND=ON \
            -DSUPPORT_SDL2_SOUND=ON \
            -DTCLTK_PREFIX="$(cygpath -m "$PWD/tcltk/local")"
          cmake --build build --parallel

      - name: Scripted session
        run: scripts/run-tcl-bridge-test build

      - name: Create Tk Windows Archive
        id: create_win_tk_archive
        run: |
          package_name=${{ steps.store_config.outputs.tkapp }}-${{ steps.store_config.outputs.version }}
          scripts/pkg_win_tcltk build "$package_name"
          echo "archive_file=${package_name}-win64-tk.zip" >> $GITHUB_OUTPUT
          echo "package_name=$package_name" >> $GITHUB_OUTPUT

      - name: The folder runs on what it carries
        run: |
          dir=${{ steps.create_win_tk_archive.outputs.package_name }}
          scripts/run-tcl-package-test "$dir" "$dir/ZangbandTK.exe"

      - name: Create Artifact with Tk Windows Archive Path
        run: |
          echo archive_path= '${{ steps.create_win_tk_archive.outputs.archive_file }}' > $WINTK_ARTIFACT_PATH

      - name: Upload Artifact with Tk Windows Archive Path
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.WINTK_ARTIFACT }}
          path: ${{ env.WINTK_ARTIFACT_PATH }}
          retention-days: 1

      - name: Upload Tk Windows Archive as Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.WINTK_ARCHIVE_ARTIFACT }}
          path: ${{ steps.create_win_tk_archive.outputs.archive_file }}
          retention-days: 1

  dos:
    # Only setup: this job builds its own text manual rather than taking the
    # docconvert job's HTML, so waiting on docconvert would be waiting for
    # nothing.
    needs: [setup]
    name: DOS (DJGPP)
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact with Configuration Information
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CONFIG_ARTIFACT }}

      - name: Extract Configuration Information and Store in Step Outputs
        id: store_config
        run: |
          name=`sed -E -n -e 's/name= //p' $CONFIG_ARTIFACT_PATH`
          echo "name=$name" >> $GITHUB_OUTPUT
          version=`sed -E -n -e 's/version= //p' $CONFIG_ARTIFACT_PATH`
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make zip

      # Need commit history and tags for scripts/version.sh to work as expected
      # so use 0 for fetch-depth.  Everything that unpacks into the working
      # directory has to come after this, since checking out cleans it.
      - name: Clone Project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The text manual is built here rather than taken from the docconvert
      # job, which produces HTML: a machine that cannot run a browser wants
      # the plain text, and Makefile.ibm's dist target looks for it in
      # docs/_build/text.  It copies whatever it finds there with a || true,
      # so getting this wrong ships an empty docs directory and says nothing.
      # Both steps are after the checkout -- setup-python's cache key is a
      # file in the repository, so it cannot run before there is one.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Sphinx for the Manual
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      # The same cross-compiler the DOS Cross-compiler workflow builds with,
      # pinned to the same release, so a tagged build and a push build are the
      # same compiler.
      - name: Install the DJGPP Cross-compiler
        run: |
          archive=djgpp-linux64-gcc1210.tar.bz2
          wget --no-verbose "https://github.com/andrewwutw/build-djgpp/releases/download/v3.3/$archive"
          bunzip2 -c "$archive" | tar -xBf -
          rm "$archive"

      # Makefile.ibm's own docs target, which is the one that knows to ask for
      # the text builder and to do it with a theme that is always installed.
      - name: Build the Manual as Text
        run: |
          cd src
          make -f Makefile.ibm docs

      # The default target runs edit first, which rewrites data file names in
      # the source to fit 8.3.  That mutates the working tree, which is fine
      # on a runner and is why this is not something to run in a checkout you
      # care about.
      - name: Build
        run: |
          PATH="$PATH":"`pwd`/djgpp/bin"
          cd src
          make -f Makefile.ibm -j$(nproc)
          make -f Makefile.ibm -j$(nproc) dist

      - name: Create DOS Archive
        id: create_dos_archive
        run: |
          projname=$(cd src && make -f Makefile.ibm print-project-name | sed -En 's/^our-project-name=//p')
          archive_prefix=${{ steps.store_config.outputs.name }}-${{ steps.store_config.outputs.version }}
          mv $projname.zip ${archive_prefix}-dos.zip
          echo "archive_file=${archive_prefix}-dos.zip" >> $GITHUB_OUTPUT
          echo "projname=$projname" >> $GITHUB_OUTPUT

      # Whether the game runs under DOS is settled by the DOS Cross-compiler
      # workflow, which drives a character to its grave under DOSBox-X on every
      # push.  What is checked here is what that workflow never looks at: that
      # the zip somebody downloads has the executable, the game data and the
      # manual in it.  Each of the three has been silently absent at some
      # point -- the manual most easily, since dist copies it with a || true.
      - name: Smoke Test
        run: |
          unzip -q ${{ steps.create_dos_archive.outputs.archive_file }} -d unpacked
          root=unpacked/${{ steps.create_dos_archive.outputs.projname }}
          exe=$root/$(cd src && make -f Makefile.ibm print-executable-name | sed -En 's/^our-executable-name=//p')
          test -f "$exe"
          file "$exe" | grep -qi "MS-DOS"
          test -f $root/lib/gamedata/dungeon.txt
          test -f $root/lib/gamedata/constant.txt
          test -f $root/lib/help/dungeons.txt
          test -n "$(ls -A $root/docs)"
          # The game opens its data and help files by name, so a name DOS
          # cannot represent is a file the game cannot read -- and it does not
          # always complain: three gamedata files were parsed with a
          # tolerant parse_file, so DOS quietly ran without the Zangband
          # bestiary for as long as their names were too long.  Checked here
          # rather than trusted, and only for the two directories read by
          # name; lib/customiz carries front-end prefs DOS never asks for.
          for d in lib/gamedata lib/help ; do
            find $root/$d -type f -printf '%f\n' | awk -F. -v d="$d" '
              { base = $1 ; ext = (NF > 1) ? $NF : "" }
              NF > 2 || length(base) > 8 || length(ext) > 3 {
                print "not 8.3: " d "/" $0 ; bad = 1
              }
              END { exit (bad ? 1 : 0) }'
          done

      - name: Create Artifact with DOS Archive Path
        run: |
          echo archive_path= '${{ steps.create_dos_archive.outputs.archive_file }}' > $DOS_ARTIFACT_PATH

      - name: Upload Artifact with DOS Archive Path
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.DOS_ARTIFACT }}
          path: ${{ env.DOS_ARTIFACT_PATH }}
          retention-days: 1

      - name: Upload DOS Archive as Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.DOS_ARCHIVE_ARTIFACT }}
          path: ${{ steps.create_dos_archive.outputs.archive_file }}
          retention-days: 1

  release:
    if: github.event_name == 'push'
    needs: [ setup, source, nintendo, linux, linux-terminal, windows32, windows64, mac, mac-terminal, mac-intel, mac-terminal-intel, mac-tk, linux-tk, windows-tk, dos ]
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # gh release create both makes the tag's release and uploads the files
    # attached to it; both are writes to repository contents.
    permissions:
      contents: write
    steps:
      - name: Clone Project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Artifact with Configuration Information
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CONFIG_ARTIFACT }}

      - name: Extract Configuration Information and Store in Step Outputs
        id: store_config
        run: |
          version=`sed -E -n -e 's/version= //p' $CONFIG_ARTIFACT_PATH`
          echo "version=$version" >> $GITHUB_OUTPUT
          prerelease=`sed -E -n -e 's/prerelease= //p' $CONFIG_ARTIFACT_PATH`
          echo "prerelease=$prerelease" >> $GITHUB_OUTPUT
          draft=`sed -E -n -e 's/draft= //p' $CONFIG_ARTIFACT_PATH`
          echo "draft=$draft" >> $GITHUB_OUTPUT

      - name: Download Artifact with Source Archive Path
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.SRC_ARTIFACT }}

      - name: Extract Source Archive Path and Store in Step Outputs
        id: store_src
        run: |
          archive_path=`sed -E -n -e 's/archive_path= //p' $SRC_ARTIFACT_PATH`
          echo "archive_path=$archive_path" >> $GITHUB_OUTPUT

      - name: Download Artifact with Source Archive
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.SRC_ARCHIVE_ARTIFACT }}

      - name: Download Artifact with Nintendo Archive Path
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.NIN_ARTIFACT }}

      - name: Extract Nintendo Archive Path and Store in Step Outputs
        id: store_nin
        run: |
          archive_path=`sed -E -n -e 's/archive_path= //p' $NIN_ARTIFACT_PATH`
          echo "archive_path=$archive_path" >> $GITHUB_OUTPUT

      - name: Download Artifact with Nintendo Archive
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.NIN_ARCHIVE_ARTIFACT }}

      - name: Download Artifact with Linux Archive Path
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.LINUX_ARTIFACT }}

      - name: Extract Linux Archive Path and Store in Step Outputs
        id: store_linux
        run: |
          archive_path=`sed -E -n -e 's/archive_path= //p' $LINUX_ARTIFACT_PATH`
          echo "archive_path=$archive_path" >> $GITHUB_OUTPUT

      - name: Download Artifact with Linux Archive
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.LINUX_ARCHIVE_ARTIFACT }}

      # Each Linux job's ARM leg names its artifacts as the x86-64 leg does,
      # with -arm on the end, and the file inside that holds the archive's name
      # is called the same on both, so the ARM ones go in a directory of their
      # own.  gh release create names an asset for its file, not its path.

      - name: Download Artifact with ARM Linux Archive Path
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.LINUX_ARTIFACT }}-arm
          path: arm

      - name: Extract ARM Linux Archive Path and Store in Step Outputs
        id: store_linux_arm
        run: |
          archive_path=`sed -E -n -e 's/archive_path= //p' arm/$LINUX_ARTIFACT_PATH`
          echo "archive_path=arm/$archive_path" >> $GITHUB_OUTPUT

      - name: Download Artifact with ARM Linux Archive
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.LINUX_ARCHIVE_ARTIFACT }}-arm
          path: arm

      - name: Download Artifact with Linux Terminal Archive Path
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.LINTTY_ARTIFACT }}

      - name: Extract Linux Terminal Archive Path and Store in Step Outputs
        id: store_linux_terminal
        run: |
          archive_path=`sed -E -n -e 's/archive_path= //p' $LINTTY_ARTIFACT_PATH`
          echo "archive_path=$archive_path" >> $GITHUB_OUTPUT

      - name: Download Artifact with Linux Terminal Archive
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.LINTTY_ARCHIVE_ARTIFACT }}

      - name: Download Artifact with ARM Linux Terminal Archive Path
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.LINTTY_ARTIFACT }}-arm
          path: arm

      - name: Extract ARM Linux Terminal Archive Path and Store in Step Outputs
        id: store_linux_terminal_arm
        run: |
          archive_path=`sed -E -n -e 's/archive_path= //p' arm/$LINTTY_ARTIFACT_PATH`
          echo "archive_path=arm/$archive_path" >> $GITHUB_OUTPUT

      - name: Download Artifact with ARM Linux Terminal Archive
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.LINTTY_ARCHIVE_ARTIFACT }}-arm
          path: arm

      - name: Download Artifact with 32-bit Windows Archive Path
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.WIN32_ARTIFACT }}

      - name: Extract 32-bit Windows Archive Path and Store in Step Outputs
        id: store_win32
        run: |
          archive_path=`sed -E -n -e 's/archive_path= //p' $WIN32_ARTIFACT_PATH`
          echo "archive_path=$archive_path" >> $GITHUB_OUTPUT

      - name: Download Artifact with 32-bit Windows Archive
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.WIN32_ARCHIVE_ARTIFACT }}

      - name: Download Artifact with 64-bit Windows Archive Path
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.WIN64_ARTIFACT }}

      - name: Extract 64-bit Windows Archive Path and Store in Step Outputs
        id: store_win64
        run: |
          archive_path=`sed -E -n -e 's/archive_path= //p' $WIN64_ARTIFACT_PATH`
          echo "archive_path=$archive_path" >> $GITHUB_OUTPUT

      - name: Download Artifact with 64-bit Windows Archive
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.WIN64_ARCHIVE_ARTIFACT }}

      - name: Download Artifact with Mac Archive Path
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.MAC_ARTIFACT }}

      - name: Extract Mac Archive Path and Store in Step Outputs
        id: store_mac
        run: |
          archive_path=`sed -E -n -e 's/archive_path= //p' $MAC_ARTIFACT_PATH`
          echo "archive_path=$archive_path" >> $GITHUB_OUTPUT

      - name: Download Artifact with Mac Archive
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.MAC_ARCHIVE_ARTIFACT }}

      - name: Download Artifact with Mac Terminal Archive Path
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.MACTTY_ARTIFACT }}

      - name: Extract Mac Terminal Archive Path and Store in Step Outputs
        id: store_mac_terminal
        run: |
          archive_path=`sed -E -n -e 's/archive_path= //p' $MACTTY_ARTIFACT_PATH`
          echo "archive_path=$archive_path" >> $GITHUB_OUTPUT

      - name: Download Artifact with Mac Terminal Archive
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.MACTTY_ARCHIVE_ARTIFACT }}

      - name: Download Artifact with Intel Mac Archive Path
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.MACINTEL_ARTIFACT }}

      - name: Extract Intel Mac Archive Path and Store in Step Outputs
        id: store_mac_intel
        run: |
          archive_path=`sed -E -n -e 's/archive_path= //p' $MACINTEL_ARTIFACT_PATH`
          echo "archive_path=$archive_path" >> $GITHUB_OUTPUT

      - name: Download Artifact with Intel Mac Archive
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.MACINTEL_ARCHIVE_ARTIFACT }}

      - name: Download Artifact with Intel Mac Terminal Archive Path
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.MACTTYINTEL_ARTIFACT }}

      - name: Extract Intel Mac Terminal Archive Path and Store in Step Outputs
        id: store_mac_terminal_intel
        run: |
          archive_path=`sed -E -n -e 's/archive_path= //p' $MACTTYINTEL_ARTIFACT_PATH`
          echo "archive_path=$archive_path" >> $GITHUB_OUTPUT

      - name: Download Artifact with Intel Mac Terminal Archive
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.MACTTYINTEL_ARCHIVE_ARTIFACT }}

      - name: Download Artifact with Tk Mac Archive Path
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.MACTK_ARTIFACT }}

      - name: Extract Tk Mac Archive Path and Store in Step Outputs
        id: store_mac_tk
        run: |
          archive_path=`sed -E -n -e 's/archive_path= //p' $MACTK_ARTIFACT_PATH`
          echo "archive_path=$archive_path" >> $GITHUB_OUTPUT

      - name: Download Artifact with Tk Mac Archive
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.MACTK_ARCHIVE_ARTIFACT }}

      - name: Download Artifact with Tk Linux Archive Path
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.LINUXTK_ARTIFACT }}

      - name: Extract Tk Linux Archive Path and Store in Step Outputs
        id: store_linux_tk
        run: |
          archive_path=`sed -E -n -e 's/archive_path= //p' $LINUXTK_ARTIFACT_PATH`
          echo "archive_path=$archive_path" >> $GITHUB_OUTPUT

      - name: Download Artifact with Tk Linux Archive
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.LINUXTK_ARCHIVE_ARTIFACT }}

      - name: Download Artifact with ARM Tk Linux Archive Path
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.LINUXTK_ARTIFACT }}-arm
          path: arm

      - name: Extract ARM Tk Linux Archive Path and Store in Step Outputs
        id: store_linux_tk_arm
        run: |
          archive_path=`sed -E -n -e 's/archive_path= //p' arm/$LINUXTK_ARTIFACT_PATH`
          echo "archive_path=arm/$archive_path" >> $GITHUB_OUTPUT

      - name: Download Artifact with ARM Tk Linux Archive
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.LINUXTK_ARCHIVE_ARTIFACT }}-arm
          path: arm

      - name: Download Artifact with Tk Windows Archive Path
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.WINTK_ARTIFACT }}

      - name: Extract Tk Windows Archive Path and Store in Step Outputs
        id: store_win_tk
        run: |
          archive_path=`sed -E -n -e 's/archive_path= //p' $WINTK_ARTIFACT_PATH`
          echo "archive_path=$archive_path" >> $GITHUB_OUTPUT

      - name: Download Artifact with Tk Windows Archive
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.WINTK_ARCHIVE_ARTIFACT }}

      - name: Download Artifact with DOS Archive Path
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.DOS_ARTIFACT }}

      - name: Extract DOS Archive Path and Store in Step Outputs
        id: store_dos
        run: |
          archive_path=`sed -E -n -e 's/archive_path= //p' $DOS_ARTIFACT_PATH`
          echo "archive_path=$archive_path" >> $GITHUB_OUTPUT

      - name: Download Artifact with DOS Archive
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.DOS_ARCHIVE_ARTIFACT }}

      # Use the gh CLI,  https://cli.github.com/manual/gh_release_create , to
      # create the release.  Requires a checked out repository, thus the
      # checkout step prior to retrieving the artifacts.
      - name: Populate Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${{ steps.store_config.outputs.version }}"
          # The notes written for this version, if there are any, and
          # GitHub's own otherwise -- which, with no pull requests, is only a
          # link to the commits.  A release somebody will download from
          # deserves the written kind: which file to take, and what changed.
          notes=.github/release-notes/$release_tag.md
          if test -f "$notes" ; then
              options="-t $release_tag --notes-file $notes"
          else
              options="-t $release_tag --generate-notes"
          fi
          test x"${{ steps.store_config.outputs.draft }}" = xtrue && options="$options -d"
          test x"${{ steps.store_config.outputs.prerelease }}" = xtrue && options="$options -p"
          gh release create $release_tag \
            ${{ steps.store_src.outputs.archive_path }} \
            ${{ steps.store_win64.outputs.archive_path }} \
            ${{ steps.store_win32.outputs.archive_path }} \
            ${{ steps.store_linux.outputs.archive_path }} \
            ${{ steps.store_linux_arm.outputs.archive_path }} \
            ${{ steps.store_linux_terminal.outputs.archive_path }} \
            ${{ steps.store_linux_terminal_arm.outputs.archive_path }} \
            ${{ steps.store_nin.outputs.archive_path }} \
            ${{ steps.store_mac.outputs.archive_path }} \
            ${{ steps.store_mac_terminal.outputs.archive_path }} \
            ${{ steps.store_mac_intel.outputs.archive_path }} \
            ${{ steps.store_mac_terminal_intel.outputs.archive_path }} \
            ${{ steps.store_mac_tk.outputs.archive_path }} \
            ${{ steps.store_linux_tk.outputs.archive_path }} \
            ${{ steps.store_linux_tk_arm.outputs.archive_path }} \
            ${{ steps.store_win_tk.outputs.archive_path }} \
            ${{ steps.store_dos.outputs.archive_path }} \
            $options
