name: Book

# The manual as a printed book (scripts/book).  pages.yaml makes it and puts
# it on the site when a change lands; this makes it the same way for a pull
# request that could change it, so a chapter that breaks the layout, a
# picture art.txt can't place, or a bestiary that no longer matches the
# game's data fails here instead of on the live site.  The PDFs are kept for
# two weeks, to look at.
#
# It doesn't run for every change to src: the book reads the game only
# through its spoilers, and a change elsewhere that breaks them shows up in
# pages.yaml.

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/book/**'
      - 'lib/gamedata/**'
      - 'src/wiz-spoil.c'
      - 'src/main-spoil.c'
      - 'src/wizard.h'
      - '.github/workflows/book.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  book:
    name: Make the book
    runs-on: ubuntu-latest
    steps:
      # The full history, for scripts/version.sh, which conf.py runs.
      - name: Clone Project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      # Chrome is on the runner already.
      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt
          sudo apt-get update
          sudo apt-get install -y cmake poppler-utils

      - name: Make the book
        run: scripts/book/make-book book "$RUNNER_TEMP/book-game"

      - name: Upload the PDFs
        uses: actions/upload-artifact@v6
        with:
          name: book
          path: book/*.pdf
          retention-days: 14
