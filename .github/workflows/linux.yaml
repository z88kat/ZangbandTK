name: Linux

on:
  push:
    branches: [ master ]
  pull_request:

# These jobs only read the repository to build it, so hold the token
# down to that rather than taking whatever the repository's default
# happens to be.
permissions:
  contents: read

jobs:
  build-lists:
    name: Build lists
    runs-on: ubuntu-latest
    steps:
      - name: Clone Project
        uses: actions/checkout@v6

      # Several build inputs enumerate their contents by hand, and each is
      # otherwise only exercised by a job that runs late -- the Visual Studio
      # project at link, the DOS package at its smoke test, the install list
      # only if somebody installs.  This needs nothing but a checkout, so a gap
      # fails here in seconds rather than there in minutes.
      - name: Check hand-maintained build lists
        run: scripts/check-build-lists

  tiles:
    name: Tiles
    runs-on: ubuntu-latest
    steps:
      - name: Clone Project
        uses: actions/checkout@v6

      # The tile data, which nothing was checking automatically.
      #
      # It is here rather than in a workflow of its own, and with no paths
      # filter, and that is the whole point.  The way this went red was a
      # *gamedata* change invalidating a *tiles* artifact: MON_PSI_DRAIN was
      # added to projection.txt by the Psychic Drain commit, no tileset was
      # regenerated, and the Neon set had no picture for it for three weeks.
      # Nobody noticed because nothing ran the audit.
      #
      # So any filter would have to name every directory that can invalidate a
      # tileset -- lib/gamedata for the things being drawn, lib/tiles for the
      # sheets, scripts/tiles for the generators -- and that list is a guess
      # which has already been wrong once.  linux.yaml runs on everything, this
      # needs a checkout and Python and nothing else, and it takes seconds.  A
      # filter here would only be able to cost us the next one.
      #
      # These are the three read-only checks.  build-neon.py is not among them
      # because its --check regenerates first, which a gate must not do.
      - name: Audit the tilesets for anything with no tile
        run: python3 scripts/tiles/audit-tiles.py

      - name: Check the generated terrain row and its ordering
        run: python3 scripts/tiles/make-terrain.py --check

      - name: Check the generated service buildings
        run: python3 scripts/tiles/make-services.py --check

      - name: Check the borrowed tiles
        run: python3 scripts/tiles/borrow-tiles.py --check

      # The audit answers "is anything undrawn", which is not the same question
      # as "is what is drawn still what the generator would produce".  A
      # projection whose colour changed, or a monster renamed, leaves a tile in
      # place and makes it wrong -- and the audit is satisfied by a line
      # existing.  Regenerating and diffing is what catches that.
      #
      # The prf only, deliberately.  The PNG is written through zlib and
      # compressed output is not guaranteed identical across zlib builds, so
      # diffing it would flake on a runner that differs from the machine the
      # set was built on.  The prf is plain text and deterministic, and it is
      # the half that carries the failure anyway: a missing or moved tile is a
      # changed line in there.
      - name: The Neon set is still what its generator produces
        run: |
          python3 scripts/tiles/build-neon.py >/dev/null
          git diff --exit-code -- lib/tiles/neon/graf-neo.prf

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install gcc cmake ninja-build libx11-dev 

      - name: Clone Project
        uses: actions/checkout@v6

      - name: Build with Ninja
        run: |
          mkdir build
          cd build
          cmake -G Ninja -DCMAKE_C_FLAGS="-Werror" -DSUPPORT_TEST_FRONTEND=ON ..
          ninja -j$(nproc)
          ninja -j$(nproc) alltests

  x11-statsbackend:
    name: X11 and Statistics Backend
    runs-on: ubuntu-latest
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install gcc cmake ninja-build libx11-dev

      - name: Clone Project
        uses: actions/checkout@v6

      - name: Build with Ninja
        run: |
          mkdir build
          cd build
          cmake -G Ninja -DCMAKE_C_FLAGS="-Werror" -DSUPPORT_STATS_BACKEND=ON ..
          ninja -j$(nproc)

  ncurses:
    name: NCurses
    runs-on: ubuntu-latest
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install gcc cmake ninja-build libncursesw5-dev

      - name: Clone Project
        uses: actions/checkout@v6

      - name: Build with Ninja
        run: |
          mkdir build
          cd build
          cmake -G Ninja -DCMAKE_C_FLAGS="-Werror" -DSUPPORT_GCU_FRONTEND=ON ..
          ninja -j$(nproc)

  # The released terminal tarball, built and played on every push rather than
  # only when a tag is cut.  The NCurses job above also builds the curses front
  # end, but it builds it the ordinary way and stops at the link; this is the
  # one that has to produce something a stranger can download and run on a
  # machine that is not this one, so it packages the archive and then plays the
  # game inside it on a different distribution.
  terminal-package:
    name: Terminal package
    runs-on: ubuntu-22.04
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc cmake ninja-build libncurses-dev file

      - name: Clone Project
        uses: actions/checkout@v6

      - name: Build and Package
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE="-O2 -DNDEBUG -Werror -DUSE_PRIVATE_PATHS" \
            -DSC_INSTALL=ON \
            -DSUPPORT_GCU_FRONTEND=ON \
            -DGCU_STATIC_CURSES=ON
          cmake --build build --parallel
          scripts/pkg_linux_tty ZangbandTK-ci

      - name: Check and Play the Archive
        run: |
          mkdir -p unpacked
          tar -xzf ZangbandTK-ci-linux64-terminal.tar.gz -C unpacked
          ldd unpacked/ZangbandTK-ci/zangbandtk
          if ldd unpacked/ZangbandTK-ci/zangbandtk \
              | grep -qE 'libncurses|libtinfo|libX11|libSDL'; then
            echo "The executable depends on a library it should not." >&2
            exit 1
          fi
          # Debian's base image has no libncursesw.so.6, which is precisely the
          # machine a dynamically linked build cannot start on.
          docker run --rm \
            -v "$PWD/unpacked/ZangbandTK-ci:/game:ro" \
            -v "$PWD/scripts/smoke-tty:/smoke-tty:ro" \
            debian:12 \
            sh -c 'apt-get update -qq >/dev/null && \
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 >/dev/null && \
              cp -R /game /play && python3 /smoke-tty /play'

  sdl2:
    name: SDL2
    runs-on: ubuntu-latest
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install gcc cmake ninja-build libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev

      - name: Clone Project
        uses: actions/checkout@v6

      - name: Build with CMake/Ninja
        run: |
          mkdir build
          cd build
          cmake -G Ninja -DCMAKE_C_FLAGS="-Werror -DSDLPUI_TRACE_EVENTS -DSDLPUI_TRACE_RENDER" -DSUPPORT_SDL2_FRONTEND=ON -DSUPPORT_SDL2_SOUND=ON ..
          ninja -j$(nproc)

  cmake-statbuild:
    name: Statistics Build (CMake)
    runs-on: ubuntu-latest
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install gcc make libsqlite3-dev libsdl2-mixer-dev cmake ninja-build

      - name: Clone Project
        uses: actions/checkout@v6

      # Turn on sound and the test front end so more of the basic
      # infrastructure is compiled.
      - name: Configure (CMake)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_FLAGS="-Wvla -Wlogical-op" \
            -DSUPPORT_STATS_FRONTEND=ON \
            -DSUPPORT_TEST_FRONTEND=ON \
            -DSUPPORT_SDL2_SOUND=ON

      - name: Build
        run: |
          cmake --build build --parallel

  autotools-statbuild:
    name: Statistics Build (Autotools)
    runs-on: ubuntu-latest
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install gcc autoconf automake make libsqlite3-dev libsdl2-mixer-dev

      - name: Clone Project
        uses: actions/checkout@v6

      # Turn on sound and the test front end so more of the basic
      # infrastructure is compiled.
      - name: Build
        run: |
          ./autogen.sh
          env CFLAGS="-Wvla -Wlogical-op" ./configure --with-no-install --enable-stats --enable-test --enable-sdl2-mixer
          make -j$(nproc)

  makefilestd:
    name: Makefile.std
    runs-on: ubuntu-latest
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install gcc make libncursesw5-dev libx11-dev libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev libsqlite3-dev

      - name: Clone Project
        uses: actions/checkout@v6

      - name: Build
        run: |
          cd src
          sed -e 's/^# SYS_x11 =/SYS_x11 =/' -e 's/^# SYS_stats =/SYS_stats =/' -e 's/^# SYS_stats_objs =/SYS_stats_objs =/' <Makefile.std >Makefile.std.modified
          make -f Makefile.std.modified -j$(nproc)
          make -f Makefile.std.modified clean
          sed -e 's/^# SYS_sdl2 =/SYS_sdl2 =/' -e 's/^# SYS_sdl2_objs =/SYS_sdl2_objs =/' -e 's/^#SOUND_sdl2 =/SOUND_sdl2 =/' -e 's/^#SOUND_sdl_objs =/SOUND_sdl_objs =/' <Makefile.std >Makefile.std.modified
          make -f Makefile.std.modified -j$(nproc)
