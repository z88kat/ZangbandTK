name: DOS Cross-compiler

on:
  push:
    branches: [ master ]
  pull_request:

# These jobs only read the repository to build it, so hold the token
# down to that rather than taking whatever the repository's default
# happens to be.
permissions:
  contents: read

jobs:
  build:
    name: DOS build and runtime test
    runs-on: ubuntu-latest
    steps:
      - name: Install Build Dependencies
        id: install_depend
        run: |
          sudo apt-get update
          sudo apt-get install make dosbox-x

      - name: Clone Project
        uses: actions/checkout@v6

      - name: Build
        run: |
          archive=djgpp-linux64-gcc1210.tar.bz2
          wget --no-verbose "https://github.com/andrewwutw/build-djgpp/releases/download/v3.3/$archive"
          bunzip2 -c "$archive"| tar -xBf -
          rm "$archive"
          PATH="$PATH":"`pwd`/djgpp/bin"
          cd src
          make -f Makefile.ibm -j$(nproc)
          make -f Makefile.ibm -j$(nproc) dist

      - name: Prepare DOS runtime environment
        run: |
          projname=$(cd src && make -f Makefile.ibm print-project-name | sed -En 's/^our-project-name=//p')
          mkdir dosroot
          wget --no-verbose https://sandmann.dotster.com/cwsdpmi/csdpmi7b.zip
          unzip csdpmi7b.zip -d dosroot
          unzip $projname.zip -d dosroot

      - name: DOS runtime smoke test
        timeout-minutes: 5
        run: |
          projname=$(cd src && make -f Makefile.ibm print-project-name | sed -En 's/^our-project-name=//p')
          exename=$(cd src && make -f Makefile.ibm print-executable-name | sed -En 's/^our-executable-name=//p' | tr "[:lower:]" "[:upper:]")

          # The queued keys play a character from birth to grave: Enter clears
          # the splash, '@' takes the birth menu's "Finish with random
          # choices", Enter accepts the confirmation, and '^' 'x' is Ctrl-X,
          # save and quit -- '^' being a control prefix in the main command
          # loop, see src/ui-input.c.
          #
          # Offering that quit once, at ten seconds, is not enough, and not
          # because ten seconds is too soon: keys wait in the BIOS buffer
          # whether the game is reading them or not.  It is that they get
          # spent.  Every -more- prompt spends exactly one key, and the game
          # empties the buffer outright whenever it flushes input (see
          # TERM_XTRA_FLUSH in src/main-ibm.c).  So a '^' vanishes into
          # whatever the game has to say to a new character -- and it has more
          # to say than it used to -- leaving 'x' to arrive alone as a command
          # that quits nothing.  Then the game plays on for as long as you let
          # it, which is how this became a two-minute timeout with an empty
          # log rather than a failure.
          #
          # So: clear the prompts with Escape, then send the pair, and keep
          # offering it.  'escape' is addkey's name for that key -- 'esc' is
          # AUTOTYPE's and addkey silently declines the whole line.
          cat > dosbox.conf << EOF
          [sdl]
          fullscreen=false
          [dosbox]
          machine=svga_s3
          [cpu]
          core=normal
          cycles=auto
          [autoexec]
          mount c dosroot
          c:
          BIN\CWSDPMI.EXE
          cd $projname
          echo "Queue keys to create DOSUSER and exit" >> ..\OUT.LOG
          addkey p500 Enter @ Enter
          addkey p15000 escape escape ^ x
          addkey p30000 escape escape ^ x
          addkey p60000 escape escape ^ x
          addkey p90000 escape escape ^ x
          addkey p120000 escape escape ^ x
          addkey p150000 escape escape ^ x
          addkey p151000 escape escape
          echo "Run $exename" >> ..\OUT.LOG
          $exename >> ..\OUT.LOG
          echo "$exename finished" >> ..\OUT.LOG
          EOF

          rm -f dosbox.log dosroot/OUT.LOG dosroot/$projname/lib/save/DOSUSER

          # Bound the emulator here rather than leaving it to the step's own
          # timeout.  A step killed from outside says nothing about why: the
          # checks below never run and neither log is ever read.
          timeout 240 dosbox-x -debug -conf dosbox.conf -nogui -exit > dosbox.log 2>&1 \
            || echo "dosbox-x exited $? (124 means it outlasted the four-minute bound)"

          echo "=== Save Directory ==="
          ls -l dosroot/$projname/lib/save || echo "(save directory not found)"

          if [ ! -f dosroot/OUT.LOG ] || ! grep -q "$exename finished" dosroot/OUT.LOG; then
            echo "ERROR: OUT.LOG missing or $exename did not finish"
            exit 1
          fi

          if [ ! -f dosroot/$projname/lib/save/DOSUSER ]; then
            echo "ERROR: DOSUSER save file missing"
            exit 1
          fi

      - name: Get Contents of OUT.LOG
        if: failure() || success()
        run: |
          echo "=== OUT.LOG ==="
          [ -f dosroot/OUT.LOG ] && cat dosroot/OUT.LOG || echo "(OUT.LOG not found)"

      - name: Get Contents of dosbox.log if Jobs Failed
        if: failure()
        run: |
          echo "=== dosbox.log ==="
          [ -f dosbox.log ] && cat dosbox.log || echo "(dosbox.log not found)"
