name: DOS Cross-compiler

on:
  push:
    branches: [ master ]
  pull_request:

# These jobs only read the repository to build it, so hold the token
# down to that rather than taking whatever the repository's default
# happens to be.
permissions:
  contents: read

jobs:
  build:
    name: DOS build and runtime test
    runs-on: ubuntu-latest
    steps:
      - name: Install Build Dependencies
        id: install_depend
        run: |
          sudo apt-get update
          sudo apt-get install make dosbox-x

      - name: Clone Project
        uses: actions/checkout@v6

      - name: Build
        run: |
          archive=djgpp-linux64-gcc1210.tar.bz2
          wget --no-verbose "https://github.com/andrewwutw/build-djgpp/releases/download/v3.3/$archive"
          bunzip2 -c "$archive"| tar -xBf -
          rm "$archive"
          PATH="$PATH":"`pwd`/djgpp/bin"
          cd src
          make -f Makefile.ibm -j$(nproc)
          make -f Makefile.ibm -j$(nproc) dist

      - name: Prepare DOS runtime environment
        run: |
          projname=$(cd src && make -f Makefile.ibm print-project-name | sed -En 's/^our-project-name=//p')
          mkdir dosroot
          wget --no-verbose https://sandmann.dotster.com/cwsdpmi/csdpmi7b.zip
          unzip csdpmi7b.zip -d dosroot
          unzip $projname.zip -d dosroot

      - name: Check packaged names are 8.3
        run: |
          # release.yaml already asserts this on the release archive, but only
          # there -- so a name DOS cannot represent reached master and showed up
          # as an empty smoke.out, which says nothing about why.  The same check
          # here turns that into the filename.
          #
          # It has bitten twice: three gamedata files once parsed with a tolerant
          # parse_file and DOS quietly ran without the Zangband bestiary, and
          # monster_speech.txt later failed loudly because its parser is strict.
          projname=$(cd src && make -f Makefile.ibm print-project-name | sed -En 's/^our-project-name=//p')
          for d in lib/gamedata lib/help ; do
            find dosroot/$projname/$d -type f -printf '%f\n' | awk -F. -v d="$d" '
              { base = $1 ; ext = (NF > 1) ? $NF : "" }
              NF > 2 || length(base) > 8 || length(ext) > 3 {
                print "not 8.3: " d "/" $0 ; bad = 1
              }
              END { exit (bad ? 1 : 0) }'
          done

      - name: DOS runtime smoke test
        timeout-minutes: 3
        run: |
          projname=$(cd src && make -f Makefile.ibm print-project-name | sed -En 's/^our-project-name=//p')
          exename=$(cd src && make -f Makefile.ibm print-executable-name | sed -En 's/^our-executable-name=//p' | tr "[:lower:]" "[:upper:]")

          # The game is driven from a script rather than typed at.  main-test.c
          # is a front end that reads a command per line from stdin -- the same
          # one tests/run-test uses -- and the DOS build carries it because
          # Makefile.ibm defines USE_TEST.  So the whole thing is a redirect,
          # and there is no timing in it anywhere.
          #
          # It used to queue keystrokes into DOSBox-X and play a character from
          # birth to grave, which took ninety seconds and broke whenever the
          # game gained something to say at startup: every -more- prompt spends
          # one queued key, and Ctrl-X is typed as '^' then 'x', so a message
          # arriving at the wrong moment would swallow the '^' and leave the
          # 'x' to land alone as a command that quit nothing.  The game then
          # played on until the step timed out, with an empty log.  Six runs
          # failed that way in August 2026.  Nothing here can fail like that,
          # because nothing here is a keystroke.
          #
          # The script and the expected output are tests/birth/Hu-Wa, shared
          # with the native end-to-end tests so the two cannot drift apart.
          cp tests/birth/Hu-Wa/input dosroot/$projname/SMOKE.TXT

          cat > dosbox.conf << EOF
          [sdl]
          fullscreen=false
          [dosbox]
          machine=svga_s3
          [mixer]
          nosound=true
          [cpu]
          core=normal
          cycles=auto
          [autoexec]
          mount c dosroot
          c:
          BIN\CWSDPMI.EXE
          cd $projname
          $exename -mtest < SMOKE.TXT >> ..\OUT.LOG
          echo DOS-SMOKE-DONE >> ..\OUT.LOG
          EOF

          rm -f dosbox.log dosroot/OUT.LOG

          # Bound the emulator here rather than leaving it to the step's own
          # timeout.  A step killed from outside says nothing about why: the
          # checks below never run and neither log is ever read.
          timeout 120 dosbox-x -debug -conf dosbox.conf -nogui -exit > dosbox.log 2>&1 \
            || echo "dosbox-x exited $? (124 means it outlasted the two-minute bound)"

          if ! grep -q DOS-SMOKE-DONE dosroot/OUT.LOG 2>/dev/null ; then
            echo "ERROR: $exename did not finish"
            exit 1
          fi

          # Everything the game printed, without the marker or DOS's carriage
          # returns, has to be exactly what the script is supposed to produce.
          # Being able to name its own race and class means the data files were
          # found and parsed -- which is the part 8.3 filenames break.
          sed -e '/DOS-SMOKE-DONE/d' -e 's/\r$//' dosroot/OUT.LOG > smoke.out
          if ! diff -u tests/birth/Hu-Wa/output smoke.out ; then
            echo "ERROR: $exename did not produce the expected output"
            exit 1
          fi

      - name: Get Contents of OUT.LOG
        if: failure() || success()
        run: |
          echo "=== OUT.LOG ==="
          [ -f dosroot/OUT.LOG ] && cat dosroot/OUT.LOG || echo "(OUT.LOG not found)"

      - name: Get Contents of dosbox.log if Jobs Failed
        if: failure()
        run: |
          echo "=== dosbox.log ==="
          [ -f dosbox.log ] && cat dosbox.log || echo "(dosbox.log not found)"
